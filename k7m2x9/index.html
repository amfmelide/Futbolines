/* ============================================================
   14 · MODALES + NAVEGACIÓN
   ============================================================ */
const modales=["mFicha","mAdmin","mLegal"];
let focoPrevio=null;
function focosDe(el){
  return [...el.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(e=>e.offsetParent!==null);
}
function atraparFoco(e){
  const abierto=modales.map(m=>$("#"+m)).find(m=>m.classList.contains("on"));
  if(!abierto||e.key!=="Tab") return;
  const f=focosDe(abierto); if(!f.length) return;
  const primero=f[0], ultimo=f[f.length-1];
  if(e.shiftKey && document.activeElement===primero){ e.preventDefault(); ultimo.focus(); }
  else if(!e.shiftKey && document.activeElement===ultimo){ e.preventDefault(); primero.focus(); }
}
function openM(id){
  if(id==="mLegal" && !$("#lBody").innerHTML.trim()){
    $("#lTitle").textContent=T("legal"); $("#lBody").innerHTML=legalHTML();
  }
  const caja=$("#"+id);
  focoPrevio=document.activeElement;
  caja.classList.add("on");
  caja.setAttribute("role","dialog");
  caja.setAttribute("aria-modal","true");
  document.body.style.overflow="hidden";
  setTimeout(()=>{ const f=focosDe(caja); (f[1]||f[0])?.focus(); },40);
  history.pushState({modal:id},"",location.hash||"#"+vista.tab);
}
function closeM(id){
  $("#"+id).classList.remove("on");
  if(focoPrevio&&document.body.contains(focoPrevio)){ focoPrevio.focus(); focoPrevio=null; }
  if(!modales.some(m=>$("#"+m).classList.contains("on"))) document.body.style.overflow="";
  if(id==="mLegal"){ $("#lTitle").textContent=""; $("#lBody").innerHTML=""; }
}
function cerrarTodo(){ modales.forEach(m=>$("#"+m).classList.remove("on")); document.body.style.overflow=""; }

window.addEventListener("popstate",e=>{
  const abierto=modales.find(m=>$("#"+m).classList.contains("on"));
  if($("#tv").classList.contains("on")){ cerrarTv(); return; }
  if(abierto){ cerrarTodo(); return; }
  const h=location.hash.slice(1);
  if(h&&TABS.includes(h)) irTab(h,false);
});
document.addEventListener("keydown",atraparFoco);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if($("#tv").classList.contains("on")) return cerrarTv();
    cerrarTodo();
  }
});

/* ============================================================
   15 · ARRANQUE
   ============================================================ */
function normalizar(d){
  tocar();
  const s=d||{};
  s.grupos=s.grupos||[];
  s.calendario=s.calendario||{};
  s.jornadas=s.jornadas||{};
  s.ajustes=s.ajustes||[];
  s.palmares=s.palmares||[];
  s.passHash=null;                 // ya no se usa: la contraseña la comprueba el servidor
  s.grupos.forEach(g=>{
    if(!s.calendario[g.id]) s.calendario[g.id]=[];
    if(!s.jornadas[g.id]) s.jornadas[g.id]=s.calendario[g.id].map(()=>({fecha:"",lugar:""}));
  });
  return s;
}
function estadoInicial(){
  const s=normalizar(clone(SEED));
  s.grupos.forEach(g=>{
    s.calendario[g.id]=generarCalendario(g.parejas.map(p=>p.id));
    s.jornadas[g.id]=s.calendario[g.id].map(()=>({fecha:"",lugar:""}));
  });
  return s;
}
(async function init(){
  try{ const l=localStorage.getItem("liga-lang"); if(l==="es"||l==="gl") LANG=l; }catch{}
  document.documentElement.lang=LANG;
  try{ const h=JSON.parse(localStorage.getItem(LS_HIST)||"[]"); h.forEach(x=>HIST.push(x)); }catch{}
  try{ autor=localStorage.getItem(LS_AUTOR)||""; }catch{}
  cargarCola();

  // Temporada: ?t=codigo o la primera de la lista
  const qs=new URLSearchParams(location.search).get("t");
  const lista=CONFIG.temporadas||[];
  if(qs&&lista.some(t=>t.codigo===qs)) CODIGO=qs;
  else if(lista.length) CODIGO=lista[0].codigo;

  const hash=location.hash.slice(1);
  if(hash&&TABS.includes(hash)) vista.tab=hash;

  ST=normalizar(clone(SEED));
  ST.grupos.forEach(g=>{ ST.calendario[g.id]=[]; ST.jornadas[g.id]=[]; });

  if(sbOn()){
    cargando=true; render(); irTab(vista.tab,false);
    const [d,filas]=await Promise.all([sbCargar(),sbCargarPartidos()]);
    ST = d ? normalizar(d) : estadoInicial();
    fusionarPartidos(filas);
    selloPartidos=await sbSelloPartidos();
    cargando=false; ultimaSync=Date.now();
    render(); irTab(vista.tab,false);
    arrancarAutoRefresco();
    vaciarCola();
  }else{
    ST = (typeof SEED_LISTO!=="undefined" && SEED_LISTO)
      ? normalizar(clone(SEED))     // datos reales metidos por la exportación
      : estadoInicial();            // primera vez: ejemplo con calendario
    cargando=false;
    render(); irTab(vista.tab,false);
  }

  // Única entrada al panel: cinco toques seguidos sobre el escudo.
  // Nada de #admin en la dirección: quedaría en el historial, en el
  // portapapeles y en cualquier enlace que se comparta por error.
  let toques=0, ultimo=0;
  document.querySelector(".mark")?.addEventListener("click",()=>{
    const t=Date.now();
    toques = (t-ultimo<900) ? toques+1 : 1;
    ultimo=t;
    if(toques>=5){ toques=0; openAdmin(); }
  });

  // Abre la web sin cobertura. Si sw.js no está, no pasa nada.
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
