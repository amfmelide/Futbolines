.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,16,.35) 0%,rgba(5,6,10,.7) 45%,rgba(8,10,16,.9) 100%)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:18px}
header h1{font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;font-weight:800;font-size:clamp(2.6rem,11vw,3.6rem);line-height:.9;margin:0;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45)}
header p{margin:10px 0 20px;color:rgba(255,255,255,.85);max-width:34ch}

.next{display:block;width:100%;text-align:left;border:0;cursor:pointer;font-family:inherit;color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c) 0%,rgba(20,23,30,.92) 75%);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.next .k{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.next .nm{font:800 1.9rem/1 "Barlow Condensed",sans-serif;margin:6px 0 4px}
.next .dt{font-size:.92rem;opacity:.9}
.next .cd{position:absolute;right:16px;top:50%;transform:translateY(-50%);text-align:center;line-height:1}
.next .cd b{display:block;font:800 2.8rem "Barlow Condensed",sans-serif}
.next .cd span{font-size:.78rem;font-weight:600;opacity:.85}
.next .nm,.next .dt{padding-right:84px}

.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;cursor:pointer;font:600 .95rem Barlow,sans-serif;padding:9px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);transition:background .15s,opacity .15s}
.chip .sw{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.45}
.chip.on{background:#fff;color:#141820;border-color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}

.card{background:var(--surface);border-radius:22px;padding:14px 12px 10px;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}
.nav h2{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.7rem;text-transform:capitalize}
.nav h2 small{font-weight:600;color:var(--ink-2);margin-left:6px}
.nav .btns{display:flex;gap:6px}
.nav button{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
.nav .hoy{width:auto;padding:0 14px;border-radius:999px;font:600 .9rem Barlow,sans-serif}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wd span{font-size:.78rem;font-weight:600;color:var(--ink-2);padding:4px 0}
.grid{row-gap:2px}
.day{border:0;background:none;color:var(--ink);cursor:pointer;min-height:54px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font:500 1.05rem Barlow,sans-serif;border-radius:12px}
.day.out{opacity:.35}
.day.past .n{color:var(--ink-2)}
.day .n{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.day.today .n{color:var(--presas);font-weight:700}
.day.sel .n{background:var(--sel);color:var(--sel-ink);font-weight:700}
.day.today.sel .n{background:var(--presas);color:#fff}
.marks{display:flex;gap:3px;align-items:center;height:10px}
.m{border-radius:50%;background:var(--c)}
.m.torneo{width:5px;height:5px}
.m.open{width:7px;height:7px}
.m.master{width:10px;height:10px;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--c)}
.m.done{opacity:.35}
.legend{display:flex;justify-content:center;gap:16px;padding:10px 0 2px;font-size:.82rem;color:var(--ink-2);border-top:1px solid var(--line);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .m{--c:var(--ink-2)}

.list{margin-top:16px}
.list h3{margin:0 0 10px;color:#fff;font:700 1.35rem "Barlow Condensed",sans-serif;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.ev{width:100%;text-align:left;border:0;cursor:pointer;display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;background:var(--surface);color:var(--ink);border-radius:16px;padding:12px;margin-bottom:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:6px solid var(--c);font-family:inherit}
.ev.done{opacity:.5}
.ev .d{text-align:center;line-height:1}
.ev .d b{display:block;font:800 1.9rem "Barlow Condensed",sans-serif}
.ev .d i{font-style:normal;font-size:.8rem;color:var(--ink-2);text-transform:capitalize}
.ev .t{font-weight:600;font-size:1.05rem}
.ev .s{font-size:.88rem;color:var(--ink-2);margin-top:3px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:6px;color:#fff;background:var(--c)}
.tag.ty{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.tag.ty.master{background:var(--ink);color:#141820;box-shadow:none}
.tag.fin{background:var(--surface-2);color:var(--ink-2)}
.empty{background:var(--surface);border-radius:16px;padding:18px;color:var(--ink-2);text-align:center}

.adminbar{display:none;gap:8px;margin-bottom:14px}
.admin .adminbar{display:flex}
.btn{border:0;cursor:pointer;border-radius:14px;padding:13px 16px;font:600 1rem Barlow,sans-serif;background:var(--sel);color:var(--sel-ink);flex:1}
.btn.alt{background:var(--surface-2);color:var(--ink);flex:0 0 auto}
.btn.danger{background:rgba(229,48,45,.16);color:#ff8a87}
.btn.acc{background:var(--accent);color:#fff}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;max-height:92%;overflow-y:auto;background:rgba(24,27,35,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet-bg.open{opacity:1;pointer-events:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h4{margin:8px 0 4px;font:800 2rem/1 "Barlow Condensed",sans-serif}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:16px 0 0}
.sheet dt{color:var(--ink-2)}
.sheet dd{margin:0;font-weight:600}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.acts .two{display:none;gap:8px}
.admin .acts .two{display:flex}
form label{display:block;font-size:.85rem;color:var(--ink-2);margin:12px 0 6px;font-weight:600}
form input,form select{width:100%;font:500 16px Barlow,sans-serif;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);-webkit-appearance:none;appearance:none}
form .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#ff8a87;font-size:.9rem;min-height:1.2em;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:#141820;font-weight:600;padding:12px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="wrap">
  <a class="back" href="index.html">‹ AMF Melide</a>
  <header>
    <h1>Calendario de torneos</h1>
    <p>Todas las fechas de los torneos Presas en un solo sitio.</p>
  </header>

  <div class="adminbar">
    <button class="btn acc" id="addBtn">+ Añadir torneo</button>
    <button class="btn alt" id="logoutBtn">Salir</button>
  </div>

  <div id="next"></div>

  <section class="filters" aria-label="Filtros">
    <div class="row" id="types"></div>
  </section>

  <section class="card" aria-label="Calendario">
    <div class="nav">
      <h2 id="title"></h2>
      <div class="btns">
        <button class="hoy" id="today">Hoy</button>
        <button id="prev" aria-label="Mes anterior">‹</button>
        <button id="nextM" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="wd"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="m master"></i>Máster</span>
      <span><i class="m open"></i>Open</span>
      <span><i class="m torneo"></i>Torneo</span>
    </div>
  </section>

  <section class="list" aria-live="polite">
    <h3 id="listTitle"></h3>
    <div id="list"><div class="empty">Cargando torneos…</div></div>
  </section>
</main>

<div class="sheet-bg" id="sheetBg"></div>

<div class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="grab"></div>
  <div id="shTags"></div>
  <h4 id="shTitle"></h4>
  <dl id="shInfo"></dl>
  <div class="acts">
    <button class="btn acc" id="icsBtn">📅 Añadir a mi calendario</button>
    <div class="two">
      <button class="btn alt" style="flex:1" id="editBtn">Editar</button>
      <button class="btn danger" style="flex:1" id="delBtn">Borrar</button>
    </div>
    <button class="btn alt" data-close>Cerrar</button>
  </div>
</div>

<div class="sheet" id="formSheet" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="grab"></div>
  <h4 id="fTitle">Añadir torneo</h4>
  <form id="form" autocomplete="off">
    <label for="fNombre">Nombre</label>
    <input id="fNombre" required maxlength="80">
    <div class="pair">
      <input type="hidden" id="fMarca" value="Presas">
      <div style="grid-column:1/-1"><label for="fTipo">Tipo</label><select id="fTipo"><option>Máster</option><option>Open</option><option>Torneo</option></select></div>
    </div>
    <div class="pair">
      <div><label for="fInicio">Empieza</label><input id="fInicio" type="date" required></div>
      <div><label for="fFin">Termina</label><input id="fFin" type="date" required></div>
    </div>
    <label for="fLugar">Lugar</label>
    <input id="fLugar" maxlength="80">
    <div class="err" id="fErr"></div>
    <div class="acts">
      <button class="btn acc" type="submit" id="fSave">Guardar</button>
      <button class="btn alt" type="button" data-close>Cancelar</button>
    </div>
  </form>
</div>

<div class="sheet" id="loginSheet" role="dialog" aria-modal="true" aria-labelledby="lTitle">
  <div class="grab"></div>
  <h4 id="lTitle">Editar calendario</h4>
  <form id="loginForm">
    <label for="lPass">Contraseña</label>
    <input id="lPass" type="password" required autocomplete="current-password">
    <div class="err" id="lErr"></div>
    <div class="acts">
      <button class="btn acc" type="submit">Entrar</button>
      <button class="btn alt" type="button" data-close>Cancelar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = "https://axjanluawnatwqmwwbgd.supabase.co";
const SB_KEY = "sb_publishable_Gqh04bjVCdIalALPEcFOmw_ywOrvDXs";
const H = {apikey:SB_KEY, "Content-Type":"application/json"};

const MARCAS = {Presas:"var(--presas)"};
const HEX = {Presas:"#E5302D", Infinity:"#7B5CFF", Tsunami:"#13B5D6"};
const TIPOS = ["Máster","Open","Torneo"];
const RANGO = {"Máster":0,"Open":1,"Torneo":2};
const cls = t => t==="Máster"?"master":t.toLowerCase();
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

let ev = [];
const hoy0 = () => {const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const state = {marcas:new Set(Object.keys(MARCAS)), tipo:"Todos", view:null, sel:null, cur:null, editId:null};
{const n=new Date(); state.view=new Date(n.getFullYear(),n.getMonth(),1);}
let pass = null;
try{pass=sessionStorage.getItem("amf_cal_pass");}catch(e){}

const key = d => d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
const same = (a,b)=>key(a)===key(b);
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const visible = () => ev.filter(e=>state.marcas.has(e.marca) && (state.tipo==="Todos"||e.tipo===state.tipo));
const onDay = (d,list) => list.filter(e=>d>=e.a && d<=e.b);
const done = e => e.b < hoy0();

function fmt(e){
  const o={day:"numeric",month:"long"};
  if(same(e.a,e.b)) return e.a.toLocaleDateString("es-ES",{weekday:"long",...o});
  if(e.a.getMonth()===e.b.getMonth()) return `${e.a.getDate()}–${e.b.getDate()} de ${MESES[e.a.getMonth()]}`;
  return `${e.a.toLocaleDateString("es-ES",o)} – ${e.b.toLocaleDateString("es-ES",o)}`;
}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2200);}

async function load(){
  try{
    const r = await fetch(SB_URL+"/rest/v1/calendario_torneos?select=*&order=inicio.asc",{headers:H});
    if(!r.ok) throw 0;
    const rows = await r.json();
    ev = rows.map(t=>({...t, a:new Date(t.inicio+"T00:00"), b:new Date(t.fin+"T00:00")}))
      .sort((x,y)=>x.a-y.a || RANGO[x.tipo]-RANGO[y.tipo]);
    render();
  }catch(e){
    $("list").innerHTML=`<div class="empty">No se pudieron cargar los torneos. Revisa la conexión y recarga.</div>`;
  }
}
async function rpc(fn,body){
  const r = await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:H,body:JSON.stringify(body)});
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j&&j.message)||"Error");
  return j;
}

function proximo(){
  const h=hoy0(), list=visible().filter(e=>e.b>=h);
  if(!list.length){$("next").innerHTML="";return;}
  const e=list[0], dias=Math.round((e.a-h)/864e5);
  const cd = e.a<=h ? `<b>HOY</b><span>en juego</span>` : dias===1 ? `<b>1</b><span>día</span>` : `<b>${dias}</b><span>días</span>`;
  $("next").innerHTML=`<button class="next" data-id="${e.id}" style="--c:${HEX[e.marca]}">
    <div class="k">Próximo torneo · ${esc(e.marca)} · ${esc(e.tipo)}</div>
    <div class="nm">${esc(e.nombre)}</div>
    <div class="dt">${fmt(e)}${e.lugar?" · "+esc(e.lugar):""}</div>
    <div class="cd">${cd}</div></button>`;
}

function filters(){
  $("types").innerHTML = ["Todos",...TIPOS].map(t=>
    `<button class="chip ${state.tipo===t?"on":""}" data-t="${t}">${t}</button>`).join("");
}

function grid(){
  const y=state.view.getFullYear(), m=state.view.getMonth();
  $("title").innerHTML = `${MESES[m]}<small>${y}</small>`;
  const off=(new Date(y,m,1).getDay()+6)%7, start=new Date(y,m,1-off), h=hoy0(), list=visible();
  const weeks=Math.ceil((off+new Date(y,m+1,0).getDate())/7);
  let out="";
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const es=onDay(d,list).sort((a,b)=>RANGO[a.tipo]-RANGO[b.tipo]);
    const c=["day"]; if(d.getMonth()!==m)c.push("out"); if(d<h)c.push("past"); if(same(d,h))c.push("today"); if(state.sel&&same(d,state.sel))c.push("sel");
    const marks=es.slice(0,3).map(e=>`<i class="m ${cls(e.tipo)}${done(e)?" done":""}" style="--c:${MARCAS[e.marca]}"></i>`).join("");
    const lbl=d.getDate()+" de "+MESES[d.getMonth()]+(es.length?", "+es.map(e=>e.nombre).join(", "):"");
    out+=`<button class="${c.join(" ")}" data-d="${iso(d)}" aria-label="${esc(lbl)}"><span class="n">${d.getDate()}</span><span class="marks">${marks}</span></button>`;
  }
  $("grid").innerHTML=out;
}

function lista(){
  const list=visible(); let items,title;
  if(state.sel){
    items=onDay(state.sel,list);
    title=state.sel.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
    title=title[0].toUpperCase()+title.slice(1);
  }else{
    const y=state.view.getFullYear(), m=state.view.getMonth(), a=new Date(y,m,1), b=new Date(y,m+1,0);
    items=list.filter(e=>e.a<=b && e.b>=a);
    title="Torneos de "+MESES[m];
  }
  $("listTitle").textContent=title;
  $("list").innerHTML = items.length ? items.map(e=>`<button class="ev${done(e)?" done":""}" data-id="${e.id}" style="--c:${MARCAS[e.marca]}">
      <div class="d"><b>${e.a.getDate()}</b><i>${MESES[e.a.getMonth()].slice(0,3)}</i></div>
      <div><div><span class="tag">${esc(e.marca)}</span><span class="tag ty ${cls(e.tipo)}">${esc(e.tipo)}</span>${done(e)?'<span class="tag fin">Finalizado</span>':""}</div>
      <div class="t">${esc(e.nombre)}</div><div class="s">${fmt(e)}${e.lugar?" · "+esc(e.lugar):""}</div></div></button>`).join("")
    : `<div class="empty">${state.sel?"No hay torneos este día.":"No hay torneos este mes con estos filtros."}</div>`;
}

function render(){proximo();filters();grid();lista();}

/* ---------- hojas ---------- */
function openSheet(id){closeSheets(true);$(id).classList.add("open");$("sheetBg").classList.add("open");}
function closeSheets(keepBg){document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open"));if(!keepBg)$("sheetBg").classList.remove("open");}

function showDetail(e){
  state.cur=e;
  $("shTags").innerHTML=`<span class="tag" style="--c:${MARCAS[e.marca]}">${esc(e.marca)}</span><span class="tag ty ${cls(e.tipo)}">${esc(e.tipo)}</span>${done(e)?'<span class="tag fin">Finalizado</span>':""}`;
  $("shTitle").textContent=e.nombre;
  $("shInfo").innerHTML=`<dt>Fecha</dt><dd>${fmt(e)}</dd>${e.lugar?`<dt>Lugar</dt><dd>${esc(e.lugar)}</dd>`:""}<dt>Categoría</dt><dd>${esc(e.tipo)}</dd>`;
  $("icsBtn").style.display=done(e)?"none":"";
  openSheet("detail");
}

/* ---------- .ics ---------- */
function ics(e){
  const d=x=>iso(x).replace(/-/g,""), fin=new Date(e.b.getFullYear(),e.b.getMonth(),e.b.getDate()+1);
  const t=s=>String(s||"").replace(/[\\,;]/g,m=>"\\"+m);
  const now=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//AMF Melide//Calendario//ES","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:"+e.id+"@amfmelide.es","DTSTAMP:"+now,"DTSTART;VALUE=DATE:"+d(e.a),"DTEND;VALUE=DATE:"+d(fin),
    "SUMMARY:"+t(e.nombre),"LOCATION:"+t(e.lugar),"DESCRIPTION:"+t(e.marca+" · "+e.tipo),
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+t(e.nombre),"END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob=new Blob([txt],{type:"text/calendar;charset=utf-8"}), url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=e.nombre.replace(/[^\wáéíóúñü ]/gi,"").trim().replace(/\s+/g,"_")+".ics";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ---------- admin ---------- */
function setAdmin(on){document.body.classList.toggle("admin",on);}
async function tryLogin(p){
  const ok=await rpc("calendario_check",{p_pass:p});
  if(ok===true){pass=p;try{sessionStorage.setItem("amf_cal_pass",p);}catch(e){} setAdmin(true);return true;}
  return false;
}
function openForm(e){
  state.editId=e?e.id:null;
  $("fTitle").textContent=e?"Editar torneo":"Añadir torneo";
  $("fNombre").value=e?e.nombre:"";
  $("fMarca").value=e?e.marca:"Presas";
  $("fTipo").value=e?e.tipo:"Máster";
  const def=state.sel?iso(state.sel):"";
  $("fInicio").value=e?e.inicio:def;
  $("fFin").value=e?e.fin:def;
  $("fLugar").value=e?(e.lugar||""):"";
  $("fErr").textContent="";
  openSheet("formSheet");
}
$("fInicio").addEventListener("change",()=>{if(!$("fFin").value||$("fFin").value<$("fInicio").value)$("fFin").value=$("fInicio").value;});
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const i=$("fInicio").value,f=$("fFin").value;
  if(f<i){$("fErr").textContent="La fecha de fin no puede ser anterior al inicio.";return;}
  $("fSave").disabled=true;
  try{
    await rpc("calendario_guardar",{p_pass:pass,p_id:state.editId,p_nombre:$("fNombre").value.trim(),p_marca:$("fMarca").value,p_tipo:$("fTipo").value,p_inicio:i,p_fin:f,p_lugar:$("fLugar").value.trim()});
    closeSheets(); toast(state.editId?"Torneo actualizado":"Torneo añadido");
    const d=new Date(i+"T00:00"); state.view=new Date(d.getFullYear(),d.getMonth(),1); state.sel=null;
    await load();
  }catch(err){$("fErr").textContent=err.message;}
  $("fSave").disabled=false;
});
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); $("lErr").textContent="";
  try{ if(await tryLogin($("lPass").value)){closeSheets();toast("Modo edición activado");} else $("lErr").textContent="Contraseña incorrecta."; }
  catch(err){$("lErr").textContent="No se pudo comprobar. Inténtalo de nuevo.";}
});
$("addBtn").onclick=()=>openForm(null);
$("logoutBtn").onclick=()=>{pass=null;try{sessionStorage.removeItem("amf_cal_pass");}catch(e){} setAdmin(false);history.replaceState(null,"",location.pathname);toast("Has salido del modo edición");};
$("editBtn").onclick=()=>openForm(state.cur);
$("delBtn").onclick=async()=>{
  if(!state.cur||!confirm(`¿Borrar «${state.cur.nombre}»?`))return;
  try{await rpc("calendario_borrar",{p_pass:pass,p_id:state.cur.id});closeSheets();toast("Torneo borrado");await load();}
  catch(err){toast(err.message);}
};
$("icsBtn").onclick=()=>state.cur&&ics(state.cur);

/* ---------- eventos ---------- */
function move(n){state.view=new Date(state.view.getFullYear(),state.view.getMonth()+n,1);state.sel=null;render();}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")||e.target.id==="sheetBg"){closeSheets();return;}
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.m){const m=t.dataset.m; state.marcas.has(m)?state.marcas.delete(m):state.marcas.add(m); if(!state.marcas.size)state.marcas.add(m); render();}
  else if(t.dataset.t){state.tipo=t.dataset.t;render();}
  else if(t.dataset.d){
    const d=new Date(t.dataset.d+"T00:00");
    if(d.getMonth()!==state.view.getMonth()) state.view=new Date(d.getFullYear(),d.getMonth(),1);
    state.sel=state.sel&&same(state.sel,d)?null:d; render();
    const es=onDay(d,visible()); if(state.sel&&es.length===1)showDetail(es[0]);
  }
  else if(t.dataset.id){const x=ev.find(v=>v.id===t.dataset.id); if(x)showDetail(x);}
});
$("prev").onclick=()=>move(-1);
$("nextM").onclick=()=>move(1);
$("today").onclick=()=>{const h=hoy0();state.view=new Date(h.getFullYear(),h.getMonth(),1);state.sel=h;render();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheets();});
let sx=null,sy=null;
$("grid").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("grid").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))move(dx<0?1:-1);sx=null;});

/* ---------- inicio ---------- */
(async()=>{
  filters(); grid();
  const wantsAdmin=new URLSearchParams(location.search).get("admin")==="1";
  if(pass){ try{ if(!(await tryLogin(pass))) pass=null; }catch(e){} }
  if(wantsAdmin && !pass) openSheet("loginSheet");
  await load();
})();
</script>
</body>
</html>
