<!DOCTYPE html>
<html lang="es" data-fx="ligero">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ciegos</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ciegos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../zt4k9m/app.css">
<style>
  /* Fondo de la web de la AMF: foto del futbolín oscurecida */
  .fondo-foto { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: url('fondo.jpg') center top / cover no-repeat;
    filter: brightness(.25) blur(2px); transform: scale(1.05); }
  .fondo-velo { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(10,14,26,.45) 0%, rgba(10,14,26,.65) 60%, rgba(10,14,26,.85) 100%); }
  :root[data-theme="light"] .fondo-foto { filter: brightness(1.1) blur(3px) grayscale(.3); }
  :root[data-theme="light"] .fondo-velo { background: linear-gradient(180deg, rgba(244,246,250,.82) 0%, rgba(244,246,250,.9) 60%, rgba(244,246,250,.96) 100%); }
  header.top, main.wrap { position: relative; z-index: 2; }
  header.top { position: sticky; z-index: 20; background: rgba(10,14,26,.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  :root[data-theme="light"] header.top { background: rgba(255,255,255,.8); }
  main.wrap { padding-bottom: 40px; }

  /* toques rápidos sin zoom ni retraso */
  button, .btn, .tab, [data-partido], .gana-btn, .formato-op, .t-abrir { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body.sin-red #sync { color: var(--warn); }
  .instalar { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; border-color: var(--gold2); }

  /* habituales, bote y jugadores */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 999px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; }
  .chip:hover { border-color: var(--gold2); }
  .pago { border: 1px solid var(--border); background: transparent; border-radius: 10px; padding: 4px 8px; cursor: pointer; filter: grayscale(1); opacity: .45; font-size: 1.05rem; }
  .pago.si { filter: none; opacity: 1; border-color: var(--ok); background: rgba(0,200,83,.12); }
  .bote-n b { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--gold); }
  .premio, .cp-premio { display: block; color: var(--ok); font-weight: 700; margin-top: 4px; }
  .cp-premio { display: inline-block; font-size: 1.2rem; }
  .jug { gap: 8px; flex-wrap: wrap; } .jug.fuera b { text-decoration: line-through; color: var(--dim); }
  .vidas-mini { color: #f50057; letter-spacing: 1px; }
  .grid-s > .card.row { flex-wrap: nowrap; gap: 8px; align-items: center; }
  .grid-s > .card.row > b, .jug > b { flex: 1 1 auto; min-width: 4.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid-s > .card.row > :not(b), .jug > :not(b) { flex: none; white-space: nowrap; }
  .grid-j { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; }
  .grid-j .jug { flex-wrap: nowrap; align-items: center; padding: 10px 12px; }
  .jug .pill { font-size: .72rem; padding: 3px 8px; }
  .cp-premio small { font-size: .65em; color: var(--dim); font-weight: 600; }
  @media (max-width: 760px) { #bTV { display: none !important; } }

  /* entrada */
  .acceso { max-width: 420px; margin: 24px auto; }
  .t-lista { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .t-card { display: flex; gap: 8px; align-items: stretch; }
  .t-abrir { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .t-abrir:hover { border-color: var(--gold2); }
  .t-ico { font-size: 1.7rem; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--surface2); flex: none; }
  .t-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .t-txt b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1.05rem; }
  .t-fase { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface2); color: var(--dim); white-space: nowrap; }
  .fase-juego .t-fase, .fase-final .t-fase { background: rgba(0,200,83,.14); color: var(--ok); }
  .fase-terminado .t-fase { background: rgba(233,205,148,.14); color: var(--gold); }
  .t-borrar { flex: none; width: 48px; justify-content: center; }
  .formatos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .formato-op { display: flex; flex-direction: column; gap: 3px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; position: relative; }
  .formato-op input { position: absolute; opacity: 0; pointer-events: none; }
  .formato-op:has(input:checked) { border-color: var(--gold); background: rgba(233,205,148,.08); box-shadow: 0 0 0 1px var(--gold) inset; }
  .formato-op:has(input:focus-visible) { outline: 2px solid var(--accent); }
  .fo-ico { font-size: 1.6rem; }

  /* resultado: ¿quién ha ganado? */
  .gana-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
  .gana-btn { display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 84px; padding: 12px; border-radius: 14px; cursor: pointer;
    background: var(--surface2); border: 2px solid var(--border); color: var(--text); text-align: center; }
  .gana-btn b { font-size: 1.05rem; }
  .gana-btn .g-t { font-size: .75rem; color: var(--dim); }
  .gana-btn:hover, .gana-btn.on { border-color: var(--ok); background: rgba(0,200,83,.12); }
  .g-vs { align-self: center; color: var(--dim); font-size: .8rem; }
  #mScB .btn { min-width: 72px; justify-content: center; }

  /* campeones */
  .campeones { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; overflow: hidden;
    background: radial-gradient(90% 70% at 50% 30%, rgba(233,205,148,.20), rgba(10,14,26,.96) 60%); backdrop-filter: blur(6px); animation: cp-entra .5s ease both; }
  .cp-caja { text-align: center; max-width: 640px; position: relative; z-index: 5; }
  .cp-copa { font-size: clamp(4rem, 18vw, 7rem); animation: cp-copa 1.2s cubic-bezier(.2,1.4,.4,1) both; filter: drop-shadow(0 10px 30px rgba(233,205,148,.45)); }
  .cp-t { font-family: 'Bebas Neue', sans-serif; letter-spacing: .08em; font-size: clamp(1.4rem, 6vw, 2rem); color: var(--dim); }
  .cp-n { font-family: 'Bebas Neue', sans-serif; letter-spacing: .03em; line-height: 1.05; font-size: clamp(2.4rem, 11vw, 4.6rem);
    background: linear-gradient(178deg, #fdf0d0 0%, #e9cd94 40%, #b08d4f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cp-n i { font-style: normal; font-size: .6em; color: var(--dim); -webkit-text-fill-color: var(--dim); }
  .cp-sub { color: var(--dim); margin-top: 6px; }
  .cp-resto { margin-top: 18px; display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
  .cp-resto i { font-style: normal; color: var(--dim); }
  @keyframes cp-entra { from { opacity: 0; } }
  @keyframes cp-copa { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }

  /* barra de abajo (sólo móvil) */
  .barra-movil { display: none; }
  @media (max-width: 760px) {
    .barra-movil { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(10,14,26,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--border); }
    .barra-movil.oculto { display: none; }
    .barra-movil .btn { width: 100%; min-height: 54px; flex-direction: column; justify-content: center; gap: 0; }
    .barra-movil .btn .small { opacity: .8; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.con-barra main.wrap { padding-bottom: 110px; }
    body.con-barra #toasts { bottom: 96px; }
    .cd { grid-template-columns: repeat(3, 1fr) !important; gap: 6px !important; }
    .cd-t { padding: 8px 10px !important; }
    .cd-t b { font-size: 1.4rem !important; }
    .cd-t span { font-size: .62rem !important; }
    :root[data-theme="light"] .barra-movil { background: rgba(255,255,255,.92); }
    /* cabecera compacta: título, guardado y botones en una línea */
    header.top { padding-top: calc(8px + env(safe-area-inset-top)); }
    header.top .top-row { flex-wrap: nowrap; gap: 8px; }
    header.top .top-row > div:first-child { min-width: 0; flex: 1; }
    header.top .titulo { font-size: 1.45rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header.top .sub { font-size: .72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header.top .top-row > .spacer { display: none; }
    #sync { font-size: .68rem; max-width: 70px; text-align: right; line-height: 1.1; }
    #bDeshacer { font-size: 0; padding: 8px 10px; } #bDeshacer::before { content: "↶"; font-size: 1.1rem; }
    .tabs { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { white-space: nowrap; }
    input, select, textarea { font-size: 16px !important; }       /* iPhone no hace zoom al escribir */
  }
</style>
<link rel="stylesheet" href="../fx.css">
<script src="../fx.js" defer></script>
</head>
<body>
<div class="fondo-foto" aria-hidden="true"></div>
<div class="fondo-velo" aria-hidden="true"></div>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <div class="titulo" id="tTitulo">Ciegos</div>
        <div class="sub" id="tSub">Torneos a sorteo</div>
      </div>
      <span class="spacer"></span>
      <span class="sync" id="sync"></span>
      <a class="btn sm oculto" id="bTV" target="_blank" rel="noopener" title="Abrir la pantalla para la tele">📺 TV</a>
      <button class="btn sm oculto" id="bDeshacer" onclick="deshacer()" title="Deshacer el último cambio">↶ Deshacer</button>
      <button class="btn sm" onclick="TC.cambiarTema()" aria-label="Cambiar tema">◐</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="vacio">Cargando…</div></main>
<div class="barra-movil oculto" id="barra"></div>

<script src="../zt4k9m/config.js"></script>
<script src="../zt4k9m/engine.js"></script>
<script src="../zt4k9m/store.js"></script>
<script src="../zt4k9m/comun.js"></script>
<script src="../zt4k9m/imagen.js"></script>
<script src="../zt4k9m/ciegos.js"></script>
<script src="../zt4k9m/ciegos-vista.js"></script>
<script>
"use strict";
const C = window.TORNEO_CONFIG, E = window.CiegosEngine, S = window.TorneoStore;
const { esc, $, $$ } = TC;
const PREFIJO = "ciegos-";

let rondaSel = null;
let ROL = null;                                      // "admin" (todo) o "ciegos" (sólo esta app)
let ST = null, VERSION = 0, CODIGO = "", PASS = "", tab = "juego", guardando = null, pendiente = false, auto = true;
const HIST = [];
let autoVidas = false;                             // Vidas: por defecto los partidos listos se llaman a mano
try { auto = localStorage.getItem("ciegos-auto") !== "0"; autoVidas = localStorage.getItem("ciegos-auto-vidas") === "1"; } catch (_) {}
const autoActivo = () => (ST && ST.modo === "vidas" ? autoVidas : auto);

const ICONO = { ciegos: "🎲", monster: "🔄", suizo: "⚖️", vidas: "❤️" };
const FASES = { inscripcion: "Inscripción", juego: "Jugando", final: "Fase final", terminado: "Terminado" };
let formAbierto = false;

/* ================= SIN COBERTURA EN EL BAR =================
   Cada cambio se guarda también en el móvil. Si no hay red, se sigue jugando
   y se sube solo en cuanto vuelve la conexión (o al volver a abrir la app). */
const LSC = "ciegos-copia:";
function copiaLocal(codigo) { try { return JSON.parse(localStorage.getItem(LSC + codigo)) || null; } catch (_) { return null; } }
function copiaGuardar(pendienteSubir) {
  if (!CODIGO || !ST) return;
  try { localStorage.setItem(LSC + CODIGO, JSON.stringify({ datos: ST, version: VERSION, pendiente: !!pendienteSubir, ts: Date.now() })); } catch (_) {}
}
function copiasLocales() {
  const r = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(LSC)) { const c = copiaLocal(k.slice(LSC.length)); if (c && c.datos) r.push(Object.assign({ codigo: k.slice(LSC.length) }, c)); } } } catch (_) {}
  return r.sort((a, b) => b.ts - a.ts);
}
let offline = false, reintento = null;
function sinRed(si) {
  if (si && !offline) TC.toast("📴 Sin cobertura. Sigue jugando: todo queda guardado en el móvil y se sube solo al volver la conexión.", "", 7000);
  if (!si && offline) TC.toast("✅ Conexión recuperada: todo subido", "ok");
  offline = si;
  document.body.classList.toggle("sin-red", si);
  if (si) { estadoSync("📴 Sin red · guardado en el móvil", true); clearTimeout(reintento); reintento = setTimeout(() => { if (offline) guardar(); }, 8000); }
}
window.addEventListener("online", () => { if (CODIGO && (copiaLocal(CODIGO) || {}).pendiente) guardar(); });
window.addEventListener("beforeunload", e => { if (CODIGO && (copiaLocal(CODIGO) || {}).pendiente) { e.preventDefault(); e.returnValue = ""; } });

/* pantalla siempre encendida mientras se juega */
let candado = null;
async function pantallaEncendida() {
  if (!("wakeLock" in navigator) || document.hidden || candado) return;
  if (!ST || ST.fase === "inscripcion" || ST.fase === "terminado") return;
  try { candado = await navigator.wakeLock.request("screen"); candado.addEventListener("release", () => (candado = null)); } catch (_) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pantallaEncendida(); if (CODIGO) sondear(); } });

/* instalar como app */
let avisoInstalar = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); avisoInstalar = e; const b = $("#bInstalar"); if (b) b.classList.remove("oculto"); });
async function instalar() { if (!avisoInstalar) return; avisoInstalar.prompt(); await avisoInstalar.userChoice.catch(() => {}); avisoInstalar = null; pantallaAcceso(); }
function htmlInstalar() {
  if (TC.esPWA() || !matchMedia("(max-width: 760px)").matches) return "";
  return `<div class="card instalar"><b>📲 Llévala en el móvil como una app</b>
    <div class="small dim">${TC.esIOS() ? "En Safari: botón <b>Compartir</b> ⬆️ → <b>Añadir a pantalla de inicio</b>." : "Ábrela desde la pantalla de inicio: se abre al momento y funciona aunque en el bar no haya cobertura."}</div>
    <button class="btn sm pri ${avisoInstalar ? "" : "oculto"}" id="bInstalar" onclick="instalar()">Instalar</button></div>`;
}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ================= ACCESO ================= */
(async function inicio() {
  S.setModo("remoto", true);
  // si ya entraste en esta pestaña, no vuelve a pedir la contraseña
  const leer = k => { try { return JSON.parse(sessionStorage.getItem(k)) || null; } catch (_) { return null; } };
  const ses = leer("ciegos-admin"), ses2 = leer("torneo-admin");
  PASS = (ses && ses.pass) || (ses2 && ses2.pass) || "";
  if (ses && ses.codigo && ses.modo === S.modo) { try { await abrir(ses.codigo); return; } catch (_) {} }
  pantallaAcceso();
})();

function slug(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
}

async function comprobarPass() {
  const el = $("#aPass");
  if (el) PASS = el.value;
  if (!PASS) { TC.toast("Escribe la contraseña", "bad"); return false; }
  try { const r = await S.login(PASS); ROL = r.rol || "admin"; guardarSesion(); return true; }
  catch (e) { TC.toast(esc(e.message), "bad", 5000); return false; }
}
function guardarSesion() { try { sessionStorage.setItem("ciegos-admin", JSON.stringify({ codigo: CODIGO, pass: PASS, modo: S.modo })); } catch (_) {} }


async function pantallaAcceso() {
  $("#tabs").innerHTML = "";
  $("#tTitulo").textContent = "Ciegos";
  $("#tSub").textContent = "Torneos pequeños a sorteo";
  pintarBarra();
  let lista = null, err = "";
  if (PASS) { try { lista = (await S.listar(PASS)).filter(t => t.codigo.startsWith(PREFIJO)); } catch (e) { err = e.message; } }
  // sin contraseña (o mal): sólo la tarjeta para entrar
  if (!lista) {
    const locales = copiasLocales();
    const faltaRed = !navigator.onLine || /fetch|network|load failed|conex/i.test(err);
    $("#main").innerHTML = `<div class="acceso"><form class="card stack" onsubmit="event.preventDefault();verLista()">
      <h2>Entrar</h2>
      ${err ? `<div class="small" style="color:var(--bad)">${faltaRed ? "📴 Sin conexión." : esc(err)}</div>` : ""}
      <div><label class="f" for="aPass">Contraseña</label><input type="password" id="aPass" autocomplete="current-password" enterkeyhint="go"></div>
      <button class="btn pri big">Entrar</button>
      ${locales.length ? `<div><label class="f">Guardados en este móvil${faltaRed ? " (para seguir sin cobertura)" : ""}</label>
        ${locales.slice(0, 5).map(c => `<button type="button" class="btn" style="width:100%;justify-content:space-between;margin-bottom:6px" onclick="abrirLocal('${esc(c.codigo)}')"><span>${ICONO[c.datos.modo] || "🏆"} ${esc(c.datos.nombre || c.codigo)}</span><span class="small ${c.pendiente ? "" : "dim"}">${c.pendiente ? "⬆ sin subir" : esc(FASES[c.datos.fase] || "")}</span></button>`).join("")}</div>` : ""}
    </form>${htmlInstalar()}</div>`;
    return;
  }
  const hoy = new Date().toISOString().slice(0, 10);
  const abierto = formAbierto || !lista.length;
  $("#main").innerHTML = `
  <div class="row" style="margin:4px 0 14px">
    <h2 style="margin:0">Torneos</h2><span class="spacer"></span>
    <span class="small dim">Conectado ✓</span><button class="btn sm" type="button" onclick="cerrarSesion()">Salir</button>
  </div>
  ${lista.length ? `<div class="t-lista">${lista.map(t => `<div class="t-card fase-${esc(t.fase || "")}">
      <button class="t-abrir" type="button" onclick="entrar('${esc(t.codigo)}')">
        <span class="t-ico" data-ico="${esc(t.codigo)}">🏆</span>
        <span class="t-txt"><b>${esc(t.nombre || t.codigo)}</b><span class="small dim" data-info="${esc(t.codigo)}">${esc(t.fecha || "")}</span></span>
        <span class="t-fase">${esc(FASES[t.fase] || "")}</span>
      </button>
      <button class="btn bad t-borrar" type="button" title="Borrar este torneo" aria-label="Borrar ${esc(t.nombre || t.codigo)}" data-nombre="${esc(t.nombre || t.codigo)}" onclick="borrarDeLista('${esc(t.codigo)}', this.dataset.nombre)">🗑</button>
    </div>`).join("")}</div>` : `<div class="vacio">Todavía no hay ningún torneo. Crea el primero 👇</div>`}
  <div style="margin-top:16px">
    ${abierto ? "" : `<button class="btn pri big" type="button" style="width:100%" onclick="formAbierto=true;pantallaAcceso()">＋ Nuevo torneo</button>`}
    ${htmlInstalar()}
    <form class="card stack ${abierto ? "" : "oculto"}" onsubmit="crear(event)">
      <div class="row"><h2 style="margin:0">Nuevo torneo</h2><span class="spacer"></span>${lista.length ? `<button class="btn sm" type="button" onclick="formAbierto=false;pantallaAcceso()">Cancelar</button>` : ""}</div>
      <div><label class="f" for="nNombre">Nombre</label><input type="text" id="nNombre" required placeholder="Ciegos de los viernes"></div>
      <div class="row"><div style="flex:1"><label class="f" for="nFecha">Fecha</label><input type="date" id="nFecha" value="${hoy}"></div><div style="flex:1"><label class="f" for="nLugar">Lugar</label><input type="text" id="nLugar" placeholder="Melide"></div></div>
      <div><label class="f">Formato</label>
        <div class="formatos">${Object.entries(E.MODOS).map(([k, m], i) => `<label class="formato-op"><input type="radio" name="nModo" value="${k}" ${i ? "" : "checked"}><span class="fo-ico">${ICONO[k] || "🏆"}</span><b>${esc(m.nombre)}</b><span class="small dim">${esc(m.texto)}</span></label>`).join("")}</div></div>
      <button class="btn pri big">Crear torneo</button>
    </form>
  </div>`;
  // formato y nº de jugadores de cada torneo (se cargan aparte)
  lista.forEach(async t => {
    try {
      const d = (await S.cargar(t.codigo)).datos || {};
      const n = (d.jugadores || []).filter(j => !j.baja).length;

/* ================= GUARDADO ================= */
function cambio(fn, txt) {
  const copia = JSON.stringify(ST);
  try { fn(); } catch (e) { TC.toast(esc(e.message), "bad", 5000); return false; }
  HIST.push(copia); if (HIST.length > 40) HIST.shift();
  if (txt) { ST.log = (ST.log || []).slice(-199); ST.log.push({ ts: Date.now(), txt }); }
  copiaGuardar(true);
  pintar(); guardar();
  return true;
}
function deshacer() {
  if (!HIST.length) return;
  ST = JSON.parse(HIST.pop());
  copiaGuardar(true);
  pintar(); guardar(); TC.toast("Cambio deshecho");
}
async function guardar() {
  if (guardando) { pendiente = true; return guardando; }
  estadoSync("Guardando…");
  guardando = (async () => {
    for (let i = 0; i < 2; i++) {
      try { VERSION = (await S.guardar(CODIGO, ST, VERSION, PASS)).version; copiaGuardar(false); sinRed(false); estadoSync("Guardado ✓"); return; }
      catch (e) {
        if (!e.status && !e.conflicto) { sinRed(true); return; }           // sin cobertura: queda en el móvil y se reintenta
        if (!e.conflicto) { estadoSync("Error al guardar", true); TC.toast("No se pudo guardar: " + esc(e.message), "bad", 6000); return; }
        VERSION = (await S.cargar(CODIGO)).version;      // sólo escribe el organizador: se queda lo de este dispositivo
      }
    }
  })();
  try { await guardando; } finally { guardando = null; if (pendiente) { pendiente = false; guardar(); } }
}
function estadoSync(txt, err) { const s = $("#sync"); s.textContent = txt; s.classList.toggle("err", !!err); $("#bDeshacer").classList.toggle("oculto", !HIST.length); }
async function sondear() {
  if (guardando || document.hidden || $(".modal-bg")) return;
  if ((copiaLocal(CODIGO) || {}).pendiente) { guardar(); return; }  // primero subir lo que se hizo sin cobertura
  try {
    const v = await S.version(CODIGO);
    if (v !== VERSION) { const r = await S.cargar(CODIGO); ST = r.datos; VERSION = r.version; if (tab !== "ajustes") pintar(); }
  } catch (_) { estadoSync("📴 Sin conexión", true); }
}

/* ---------- habituales: nombres de otros torneos guardados en este móvil ---------- */
const LSH = "ciegos-habituales", LSU = "ciegos-ultimos";
function habituales() { try { return JSON.parse(localStorage.getItem(LSH)) || {}; } catch (_) { return {}; } }
// Apunta los jugadores de un torneo (una vez por torneo: no infla la cuenta al repetir)
function apuntarHabituales(codigo, nombres, fecha) {
  const h = habituales(), t = fecha ? Date.parse(fecha) || Date.now() : Date.now();
  nombres.forEach(n => {
    n = String(n || "").trim(); if (!n) return;
    const k = n.toLowerCase(), e = h[k] || { nombre: n, torneos: [], ult: 0 };
    if (!e.torneos.includes(codigo)) e.torneos.push(codigo);
    e.torneos = e.torneos.slice(-50); e.ult = Math.max(e.ult, t); e.nombre = n;
    h[k] = e;
  });
  try { localStorage.setItem(LSH, JSON.stringify(h)); } catch (_) {}
}
function listaHabituales() { return Object.values(habituales()).sort((a, b) => b.torneos.length - a.torneos.length || b.ult - a.ult).map(e => e.nombre); }
function ultimos() { try { return JSON.parse(localStorage.getItem(LSU)) || null; } catch (_) { return null; } }
function guardarUltimos(codigo, nombres, fecha) {
  const u = ultimos();
  if (u && u.codigo !== codigo && (u.fecha || "") > (fecha || "")) return;          // sólo el más reciente
  try { localStorage.setItem(LSU, JSON.stringify({ codigo, nombres, fecha: fecha || "" })); } catch (_) {}
}
function htmlHabituales() {
  const ya = new Set(E.activos(ST).map(j => j.nombre.toLowerCase()));

  const u = ultimos(), deUlt = u && u.codigo !== CODIGO ? u.nombres.filter(n => !ya.has(n.toLowerCase())) : [];
  if (!hs.length && !deUlt.length) return "";
  return `<div class="card stack" style="margin-top:14px"><div class="row"><h2 style="margin:0">⚡ Habituales</h2><span class="spacer"></span>
      ${deUlt.length ? `<button class="btn sm" onclick="cargarUltimos()">↺ Los ${deUlt.length} del último torneo</button>` : ""}</div>

    <div class="chips">${hs.map(n => `<button type="button" class="chip" data-hab="${esc(n)}">＋ ${esc(n)}</button>`).join("")}</div></div>`;
}
function cargarUltimos() {

  const ya = new Set(E.activos(ST).map(j => j.nombre.toLowerCase()));

}
function añadirPareja() {
  const a = $("#nJ1").value.trim(), b = $("#nJ2").value.trim();
  if (!a || !b) return TC.toast("Faltan los dos nombres", "bad");
  if (cambio(() => E.añadirPareja(ST, a, b))) { $("#nJ1").value = ""; $("#nJ2").value = ""; $("#nJ1").focus(); }
}
function pegarLista() {
  const lineas = $("#lista").value.split(/\n/).map(x => x.trim()).filter(Boolean);
  if (!lineas.length) return;
  cambio(() => {
    lineas.forEach(l => {
      if (E.parejasFijas(ST)) { const [a, b] = l.split(/\s*[\/,;|]\s*|\s+y\s+/i); if (a && b) E.añadirPareja(ST, a, b); }
      else E.añadirJugador(ST, l);
    });
  }, `${lineas.length} añadidos de una lista`);
}
function quitar(id) { cambio(() => { ST.jugadores = ST.jugadores.filter(j => j.id !== id); }); }
function quitarPareja(id) {
  cambio(() => { const p = E.pareja(ST, id); ST.parejas = ST.parejas.filter(x => x.id !== id); ST.jugadores = ST.jugadores.filter(j => j.id !== p.j1 && j.id !== p.j2); });
}
function empezar() {
  const sortea = !E.parejasFijas(ST) && !E.individual(ST);
  if (!confirm(sortea ? "Se sortean las parejas y empieza el torneo. ¿Seguir?" : "¿Empezar el torneo?")) return;
  if (!cambio(() => E.empezar(ST), "Torneo empezado")) return;
  const nombres = E.activos(ST).map(j => j.nombre);
  apuntarHabituales(CODIGO, nombres, ST.fecha); guardarUltimos(CODIGO, nombres, ST.fecha);
  if (autoActivo()) cambio(() => E.asignarMesas(ST));
  tab = "juego"; pintar();
  if (sortea || ST.fase === "final") sorteoParejas();
}
function sorteoParejas() {
  TC.sorteoEnDirecto({
    titulo: "Sorteo de parejas · " + ST.nombre,
    columnas: ST.parejas.map((p, i) => ({ titulo: "Pareja " + (i + 1) })),
    bolas: ST.parejas.flatMap((p, i) => [{ col: i, texto: E.nombreJugador(ST, p.j1) }, { col: i, texto: E.nombreJugador(ST, p.j2) }])
  });
}

// Vidas: al acabar las semifinales se sortean otra vez las parejas de la final
let finalVista = null;
function sorteoFinalNuevo() {
  const f = ST.ko && E.partido(ST, ST.ko.finalId);
  if (!f || !f.sorteo || !f.a || !f.b || f.estado === "fin") return false;
  const clave = f.a + "|" + f.b;
  if (finalVista === clave) return false;
  finalVista = clave; return true;
}
function sorteoFinal() {
  const f = E.partido(ST, ST.ko.finalId);
  const ps = [f.a, f.b].map(id => E.pareja(ST, id));
  TC.sorteoEnDirecto({
    titulo: "Sorteo de la final · " + ST.nombre,
    columnas: ps.map((p, i) => ({ titulo: "Pareja " + (i + 1) })),
    bolas: ps.flatMap((p, i) => [{ col: i, texto: E.nombreJugador(ST, p.j1) }, { col: i, texto: E.nombreJugador(ST, p.j2) }])
  });
}

/* ---------- juego ---------- */
function vJuego() {
  if (ST.fase === "inscripcion") return `<div class="vacio">Primero <button class="btn sm" data-tab="jugadores">apunta a los jugadores</button> y empieza el torneo.</div>`;
  let h = "";
  if (ST.fase === "terminado") h += `<div class="card" style="margin-bottom:14px;text-align:center"><h2>🏁 Torneo terminado</h2>${CV.htmlPodio(ST)}<div class="row" style="justify-content:center"><button class="btn pri" onclick="CV.imagenRedes(ST)">📸 Imagen de resultados para redes</button><button class="btn" onclick="celebrar()">🏆 Ver campeones</button></div></div>`;
  h += CV.htmlResumen(ST);
  if (ST.modo === "vidas" && ST.fase === "juego") return h + vJuegoVidas();
  const libres = E.mesasLibres(ST).length, pend = E.pendientes(ST).filter(p => p.estado === "pendiente");
  if (ST.fase !== "terminado") h += `<div class="row" style="margin-bottom:14px">
    <button class="btn pri" onclick="rellenar()" ${!libres || !pend.length ? "disabled" : ""}>▶ Llamar a mesa</button>
    <label class="check"><input type="checkbox" ${auto ? "checked" : ""} onchange="auto=this.checked;try{localStorage.setItem('ciegos-auto',auto?'1':'0')}catch(_){}"> Automático: al meter un resultado se llama al siguiente</label>
    <span class="spacer"></span><span class="dim small">${pend.length} esperando · ${libres} mesa(s) libre(s)</span></div>`;
  // ¿siguiente ronda?
  if (E.puedeSiguienteRonda(ST) && ST.fase === "juego") {
    const fin = ST.modo === "vidas" && E.vivos(ST).length <= 8;
    const tot = E.rondasTotales(ST);
    const ultima = tot && ST.ronda >= tot;
    h += `<div class="card" style="margin-bottom:14px;border-color:var(--gold2)"><b>Ronda ${ST.ronda} terminada.</b>
      <div class="row" style="margin-top:8px"><button class="btn pri big" onclick="siguiente()">${fin ? "🎲 Sortear parejas y semifinales" : ultima ? "🏁 Cerrar y ver la clasificación final" : `▶ Ronda ${ST.ronda + 1}`}</button></div>
      ${fin ? `<div class="small dim" style="margin-top:6px">Quedan ${E.vivos(ST).length} jugadores en pie: se sortean ${Math.floor(E.vivos(ST).length / 2)} parejas${E.vivos(ST).length % 2 ? " (impar: se queda fuera quien tenga menos vidas)" : ""}.</div>` : ""}</div>`;
  }
  // mesas
  const mesas = htmlMesasPanel();
  if (mesas) h += `<h2>En mesa</h2>` + mesas;
  // ronda actual / cuadro
  if (ST.ko) h += `<h2 style="margin-top:18px">${ST.ko.fase === "final" ? "Fase final" : "Cuadro"}</h2>` + CV.htmlCuadroFinal(ST, { admin: true });
  if (ST.modo === "vidas") h += `<h2 style="margin-top:18px">Vidas</h2>` + CV.htmlTableroVidas(ST);
  if (ST.modo !== "ciegos" && ST.modo !== "vidas" && ST.ronda) h += `<h2 style="margin-top:18px">Ronda ${ST.ronda}${E.rondasTotales(ST) ? " de " + E.rondasTotales(ST) : ""}</h2>` + CV.htmlRonda(ST, ST.ronda, { admin: ST.fase === "juego" });
  if (ST.modo === "vidas" && ST.fase === "juego") h += `<div class="small dim" style="margin-top:8px">Quedan <b>${E.vivos(ST).length}</b> jugadores en pie. Con 8 en pie, 4 parejas a sorteo para semifinales y nuevo sorteo para la final.</div>`;
  return h;
}
function htmlMesasPanel() {
  const enMesa = ST.partidos.filter(p => p.estado === "mesa").sort((a, b) => a.mesa - b.mesa);
  if (!enMesa.length) return "";
  return `<div class="mesas">` + enMesa.map(p => `<div class="mesa ocupada"><div class="row"><span class="num">Mesa ${p.mesa}</span><span class="spacer"></span><span class="t">⏱ ${TC.hace(p.llamado)}</span></div>
      <div class="small dim">${esc(E.nombrePartido(ST, p))}</div>
      <div class="vs"><span>${esc(E.nombreLado(ST, p.a))}</span><i>contra</i><span>${esc(E.nombreLado(ST, p.b))}</span></div>
      <div class="row"><button class="btn ok" style="flex:1" onclick="modalResultado('${p.id}')">✍ ¿Quién ha ganado?</button><button class="btn sm" onclick="cambio(()=>E.soltar(ST,'${p.id}'))" title="Devolver a la espera" aria-label="Devolver a la espera">↩</button></div></div>`).join("") + `</div>`;
}

// Vidas: sin rondas. Al acabar un partido, en cuanto hay 4 libres se sortea otro.
function vJuegoVidas() {
  const e = E.estadoVidas(ST);
  let h = "";
  if (e.listaFinal) h += `<div class="card" style="margin-bottom:14px;border-color:var(--gold2)"><b>¡Quedan 8 en pie!</b>
      <div class="small dim" style="margin:4px 0 8px">Se sortean 4 parejas entre ellos (da igual las vidas) → semifinales. Los 4 ganadores se vuelven a sortear para la final.</div>
      <button class="btn pri big" onclick="siguiente()">🎲 Sortear parejas de semifinales</button></div>`;
  else if (e.fin) h += `<div class="card" style="margin-bottom:14px"><b>¡Quedan 8 en pie!</b> <span class="dim">Cuando acabe lo que se está jugando en las mesas (ya no elimina a nadie) se sortean las semifinales.</span></div>`;
  else if (e.vivos.length <= 12) h += `<div class="small dim" style="margin:-6px 0 12px">Quedan ${e.vivos.length} en pie: sólo se ponen en verde los partidos que aseguran llegar a 8 justos (los demás se recolocan).</div>`;
  h += `<label class="check" style="margin-bottom:12px"><input type="checkbox" ${autoVidas ? "checked" : ""} onchange="autoVidas=this.checked;try{localStorage.setItem('ciegos-auto-vidas',autoVidas?'1':'0')}catch(_){};if(autoVidas)rellenar()"> Llamar solos a mesa los partidos listos (si no, los llamas tú con el botón verde)</label>`;
  const mesas = htmlMesasPanel();
  if (mesas) h += `<h2>En mesa</h2>` + mesas;
  const listos = CV.htmlListos(ST);
  if (listos) h += `<h2 style="margin-top:16px">✅ Listos para jugar</h2>` + listos;
  if (!mesas && !listos) h += `<div class="vacio">Nadie en mesa y ningún partido listo todavía.</div>`;
  h += `<div class="row" style="margin-top:12px"><button class="btn sm" data-tab="rondas">Ver todas las rondas →</button></div>`;
  h += `<h2 style="margin-top:18px">Vidas</h2>` + CV.htmlTableroVidas(ST);
  return h;
}
function llamarA(id) {
  const mesa = E.mesasLibres(ST)[0];
  if (!mesa) return TC.toast("Todas las mesas están ocupadas", "bad");
  const p = E.partido(ST, id);
  if (cambio(() => E.llamarVidas(ST, id, mesa), `Mesa ${mesa}: ${E.nombreLado(ST, p.a)} vs ${E.nombreLado(ST, p.b)}`)) TC.toast(`▶ Mesa ${mesa}: ${esc(E.nombreLado(ST, p.a))} <b>vs</b> ${esc(E.nombreLado(ST, p.b))}`, "ok", 5000);
}

function avisarNuevos(nuevos) {
  (nuevos || []).filter(p => p.fase === "ronda").forEach(p => TC.toast(`🎲 ${esc(E.nombreLado(ST, p.a))} <b>vs</b> ${esc(E.nombreLado(ST, p.b))}${p.mesa ? ` · <b>Mesa ${p.mesa}</b>` : ""}`, "ok", 6000));
}
// Tras meter un resultado (modo automático): llamar al siguiente o, en Vidas, sortear con los que han quedado libres
function trasResultado(estaba) {
  if (ST.fase === "terminado") return;
  const antes = ST.fase;
  let nuevos = [];
  // En Vidas siempre: rehacer partidos si alguien cae, sortear la ronda siguiente y, con 8, la fase final
  if (ST.modo === "vidas" && ST.fase === "juego") cambio(() => { nuevos = E.sortearVidas(ST); });
  if (autoActivo() && (estaba || nuevos.length || ST.fase !== antes)) cambio(() => E.asignarMesas(ST));
  if (antes === "juego" && ST.fase === "final") sorteoParejas();
  else if (sorteoFinalNuevo()) sorteoFinal();
  else if (nuevos.length) TC.toast(`🎲 Sorteada la ronda ${Math.max(...nuevos.map(p => p.ronda))}`, "ok", 5000);
}
function rellenar() { cambio(() => E.asignarMesas(ST)); }
function siguiente() {
  const antes = ST.fase;
  if (!cambio(() => E.siguienteRonda(ST), "Siguiente ronda")) return;
  if (autoActivo()) cambio(() => E.asignarMesas(ST));
  if (antes === "juego" && ST.fase === "final") sorteoParejas();       // Vidas: parejas de la fase final
  if (ST.fase === "terminado") celebrar();
}

function modalResultado(id) {
  const p = E.partido(ST, id);
  if (!p || !p.a || !p.b || p.bye) return;
  const editar = p.estado === "fin";
  if (editar && !E.puedeEditar(ST, id)) return TC.toast("Ese resultado ya no se puede cambiar: hay partidos posteriores jugados", "bad");
  const conMarcador = E.usaMarcador(ST);
  const nom = l => E.nombreLado(ST, p[l]);
  const boton = l => `<button type="button" class="gana-btn ${editar && p.ganador === l ? "on" : ""}" data-g="${l}"><span class="g-t">🏆 Gana</span><b>${esc(nom(l))}</b></button>`;
  TC.modal(`<h3>${esc(E.nombrePartido(ST, p))}${p.mesa ? " · Mesa " + p.mesa : ""}</h3>
    <p class="formato" style="margin:-6px 0 12px">${esc(E.textoFormato(ST.config.partidas))}</p>
    <div class="small dim" style="margin-bottom:8px">¿Quién ha ganado?</div>
    <div class="gana-grid">${boton("a")}<span class="g-vs">contra</span>${boton("b")}</div>
    ${conMarcador ? `<div id="mSc" class="oculto" style="margin-top:12px"><div class="small dim" style="margin-bottom:6px" id="mScT"></div><div class="rapidos" id="mScB"></div><div class="small dim">El marcador desempata la clasificación.</div></div>` : ""}
    <div class="row" style="margin-top:12px">${editar ? `<button class="btn sm bad" id="borrar">Borrar resultado</button>` : ""}<span class="spacer"></span><button class="btn" data-cerrar>Cancelar</button></div>`, (el, cerrar) => {
    const guardarRes = (fn, txt) => {
      const estaba = p.estado === "mesa";
      if (!cambio(fn, txt)) return;
      if (navigator.vibrate) navigator.vibrate(35);
      cerrar();
      if (ST.fase === "terminado") { celebrar(); return; }
      TC.toast("Resultado guardado", "ok");
      trasResultado(estaba);
    };
    el.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      const l = b.dataset.g;
      if (!conMarcador) return guardarRes(() => E.registrarGanador(ST, id, l), `Gana ${nom(l)}`);
      // Monster y Suizo: después del ganador, el marcador
      el.querySelectorAll("[data-g]").forEach(x => x.classList.toggle("on", x === b));
      const pos = E.marcadoresPosibles(ST).filter(([x, y]) => l === "a" ? x > y : y > x);
      el.querySelector("#mSc").classList.remove("oculto");
      el.querySelector("#mScT").innerHTML = `Marcador de <b>${esc(nom(l))}</b>:`;
      el.querySelector("#mScB").innerHTML = pos.map(([x, y]) => { const g = Math.max(x, y), q = Math.min(x, y); return `<button type="button" class="btn big ${editar && p.ra === x && p.rb === y ? "pri" : ""}" data-m="${x}-${y}">${g}-${q}</button>`; }).join("");
      el.querySelectorAll("[data-m]").forEach(m => m.onclick = () => {
        const [x, y] = m.dataset.m.split("-").map(Number);
        guardarRes(() => E.registrarResultado(ST, id, x, y), `${nom("a")} ${x}-${y} ${nom("b")}`);
      });
    });
    const br = el.querySelector("#borrar");
    if (br) br.onclick = () => { if (confirm("¿Borrar el resultado?") && cambio(() => E.borrarResultado(ST, id), "Resultado borrado")) cerrar(); };
  });
}

/* ---------- campeones: pantalla grande al acabar ---------- */
function celebrar() {
  const pod = E.podio(ST);
  if (!pod.length) return;
  const nombres = x => x.ids.map(id => esc(E.nombreJugador(ST, id))).join(" <i>y</i> ");
  const pr = E.premiosPodio(ST), premio = x => { const e = pr[x.pos + "|" + String(x.lado)]; return e ? ` <span class="cp-premio">💶 ${esc(CV.euros(e))}${x.ids.length > 1 ? ` <small>(${esc(CV.euros(e / x.ids.length))} c/u)</small>` : ""}</span>` : ""; };
  const fondo = document.createElement("div");
  fondo.className = "campeones";
  fondo.innerHTML = `<div class="cp-caja">
    <div class="cp-copa">🏆</div>
    <div class="cp-t">¡Campeones!</div>
    <div class="cp-n">${nombres(pod[0])}</div>${premio(pod[0])}
    <div class="cp-sub">${esc(ST.nombre)}</div>
    <div class="cp-resto">${pod.slice(1).map(x => `<div><span>${x.pos === 2 ? "🥈" : "🥉"}</span> ${nombres(x)}${premio(x)}</div>`).join("")}</div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn pri big" data-img>📸 Imagen para redes</button><button class="btn big" data-cerrar>Cerrar</button></div>
  </div>`;
  document.body.appendChild(fondo);
  TC.confeti(fondo);
  setTimeout(() => TC.confeti(fondo), 1600);
  fondo.addEventListener("click", e => {
    if (e.target.closest("[data-img]")) CV.imagenRedes(ST);
    else if (e.target === fondo || e.target.closest("[data-cerrar]")) fondo.remove();
  });
}

/* ---------- barra de abajo en el móvil: lo siguiente que toca hacer ---------- */
function accionSiguiente() {
  if (!ST) return null;
  if (ST.fase === "inscripcion") {
    const n = E.parejasFijas(ST) ? ST.parejas.length * 2 : E.activos(ST).length;
    return n >= (ST.modo === "vidas" ? 8 : 4) ? { txt: "▶ Empezar el torneo", fn: "empezar()" } : null;
  }
  if (ST.fase === "terminado") return { txt: "📸 Imagen para redes", fn: "CV.imagenRedes(ST)" };
  if (ST.modo === "vidas" && ST.fase === "juego") {
    const e = E.estadoVidas(ST);
    if (e.listaFinal) return { txt: "🎲 Sortear las semifinales", fn: "siguiente()" };
  } else if (E.puedeSiguienteRonda(ST) && ST.fase === "juego") return { txt: "▶ Siguiente ronda", fn: "siguiente()" };
  const libre = E.mesasLibres(ST)[0];
  if (libre) {
    if (ST.modo === "vidas" && ST.fase === "juego") {
      const est = E.estadosVidas(ST);
      const lista = ST.partidos.filter(p => (est[p.id] || {}).estado === "lista").sort((x, y) => x.ronda - y.ronda || x.n - y.n)[0];
      if (lista) return { txt: `▶ Llamar a mesa ${libre}`, sub: `${E.nombreLado(ST, lista.a)} vs ${E.nombreLado(ST, lista.b)}`, fn: `llamarA('${lista.id}')` };
    } else if (E.pendientes(ST).some(p => p.estado === "pendiente")) return { txt: `▶ Llamar a mesa ${libre}`, fn: "rellenar()" };
  }
  const mesa = ST.partidos.filter(p => p.estado === "mesa").sort((x, y) => (x.llamado || 0) - (y.llamado || 0))[0];
  if (mesa) return { txt: `✍ Anotar mesa ${mesa.mesa}`, sub: `${E.nombreLado(ST, mesa.a)} vs ${E.nombreLado(ST, mesa.b)}`, fn: `modalResultado('${mesa.id}')` };
  return null;
}
function pintarBarra() {
  const b = $("#barra"), a = accionSiguiente();
  document.body.classList.toggle("con-barra", !!a);
  b.classList.toggle("oculto", !a);
  b.innerHTML = a ? `<button class="btn pri big" onclick="${a.fn}"><span>${esc(a.txt)}</span>${a.sub ? `<span class="small">${esc(a.sub)}</span>` : ""}</button>` : "";
}

/* ---------- clasificación / cuadro ---------- */

}

/* ---------- ajustes ---------- */

  return `<form class="grid ajustes" style="align-items:start" onsubmit="guardarAjustes(event)">

      <input type="number" id="fPart" min="1" max="9" value="${f.partidas}" style="flex:1" aria-label="Partidas"><span class="small dim">partidas de</span>
      <input type="number" id="fGol" min="1" max="20" value="${f.goles}" style="flex:1" aria-label="Goles"><span class="small dim">goles</span></div>
    ${ST.modo === "monster" || ST.modo === "suizo" ? `<div><label class="f">Rondas (0 = automático: ${ST.modo === "monster" ? "5" : "según parejas"})</label><input type="number" id="cRondas" min="0" max="30" value="${c.rondas}"></div>` : ""}
    ${ST.modo === "vidas" ? `<div><label class="f">Vidas de cada jugador</label><input type="number" id="cVidas" min="1" max="9" value="${c.vidas}" ${insc ? "" : "disabled"}></div>` : ""}
    ${ST.modo === "suizo" ? `<div><label class="f">Parejas</label><select id="cParejas" ${insc ? "" : "disabled"}><option value="sorteo" ${c.parejas !== "fijas" ? "selected" : ""}>A sorteo (cada uno se apunta solo)</option><option value="fijas" ${c.parejas === "fijas" ? "selected" : ""}>Fijas (se apuntan por parejas)</option></select></div>` : ""}
    ${ST.modo === "ciegos" ? `<label class="check"><input type="checkbox" id="cTercer" ${c.tercerPuesto ? "checked" : ""} ${insc ? "" : "disabled"}> Partido por el 3er puesto</label>` : ""}
  </div>
  <div class="card stack">
    <h2>Compartir</h2>
    <a class="btn" href="${esc(urlTV())}" target="_blank" rel="noopener">📺 Pantalla TV (ábrela en el PC conectado a la tele)</a>
    <button type="button" class="btn" onclick="CV.imagenRedes(ST)" ${ST.fase === "terminado" ? "" : "disabled"}>📸 Imagen para redes</button>
  </div>
  <div class="card stack">
    <h2>💶 Reparto del bote</h2>
    <div class="row">${[0, 1, 2].map(i => `<label class="small" style="flex:1">${["🥇 1º", "🥈 2º", "🥉 3º"][i]}<input type="number" id="cRep${i}" min="0" max="100" inputmode="numeric" value="${(c.reparto || [60, 30, 10])[i] || 0}"> %</label>`).join("")}</div>
    <div class="small dim">La cuota por jugador y quién ha pagado se apuntan en la pestaña de jugadores. Si dos comparten el 3º, se reparte entre ellos.</div>
  </div>
  <div class="card stack">
    <h2>Guardar</h2>
    <button class="btn pri big">Guardar ajustes</button>
    <div class="row"><button type="button" class="btn sm" onclick="salir()">Cambiar de torneo</button><button type="button" class="btn sm bad" onclick="borrar()">Borrar torneo</button></div>
    <details class="small"><summary>Historial (${(ST.log || []).length})</summary><div style="max-height:240px;overflow:auto;margin-top:6px">${(ST.log || []).slice().reverse().map(l => `<div><span class="dim">${new Date(l.ts).toLocaleTimeString("es-ES")}</span> ${esc(l.txt)}</div>`).join("")}</div></details>
  </div></form>`;
}
function guardarAjustes(ev) {
  ev.preventDefault();
  const insc = ST.fase === "inscripcion";
  cambio(() => {
    ST.nombre = $("#cNom").value.trim() || ST.nombre; ST.fecha = $("#cFecha").value; ST.lugar = $("#cLugar").value.trim();
    const c = ST.config;
    if (insc && $("#cModo").value !== ST.modo) {
      ST.modo = $("#cModo").value;
      c.partidas = Object.assign({}, E.MODOS[ST.modo].partidas);
    } else c.partidas = { tipo: $("#fTipo").value, partidas: Math.max(1, +$("#fPart").value || 1), goles: Math.max(1, +$("#fGol").value || 7) };
    c.mesas = Math.max(1, +$("#cMesas").value || 1);
    if ($("#cRondas")) c.rondas = Math.max(0, +$("#cRondas").value || 0);
    if ($("#cVidas") && insc) c.vidas = Math.max(1, +$("#cVidas").value || 3);
    if ($("#cParejas") && insc) {
      const nuevo = $("#cParejas").value;
      if (nuevo !== c.parejas && (ST.jugadores.length)) throw new Error("Para cambiar entre parejas fijas y a sorteo, quita antes a los apuntados");
      c.parejas = nuevo;
    }
    if ($("#cTercer") && insc) c.tercerPuesto = $("#cTercer").checked;
    if ($("#cRep0")) {
      const rep = [0, 1, 2].map(i => Math.max(0, Math.round(Number($("#cRep" + i).value) || 0)));
      if (rep.reduce((a, b) => a + b, 0) > 100) throw new Error("El reparto suma más del 100 %");
      c.reparto = rep;
    }
  }, "Ajustes guardados") && TC.toast("Ajustes guardados", "ok");
}
async function borrar() {
  if (prompt(`Para borrar el torneo escribe su nombre: ${ST.nombre}`) !== ST.nombre) return;
  try { await S.borrar(CODIGO, PASS); salir(); } catch (e) { TC.toast(esc(e.message), "bad"); }
}
</script>
</body>
