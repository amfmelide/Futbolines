<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Torneos AMF</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Torneos AMF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="../fx.css">
<script src="../fx.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <div class="titulo" id="tTitulo">Torneos AMF</div>
        <div class="sub" id="tSub">Asociación Melide Futbolín</div>
      </div>
      <span class="spacer"></span>
      <span class="sync" id="sync"></span>
      <button class="btn sm no-tv" onclick="TC.cambiarTema()" title="Tema claro/oscuro" aria-label="Cambiar tema">◐</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="main"><div class="vacio">Cargando…</div></main>
<footer class="no-tv"><a href="#" onclick="event.preventDefault();privacidad()">Privacidad</a></footer>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="comun.js"></script>
<script>
"use strict";
const C = window.TORNEO_CONFIG, T = window.TorneoEngine, S = window.TorneoStore;
const { esc, $, $$, nombre, jugadores } = TC;
const params = new URLSearchParams(location.search);
const CODIGO = params.get("t") || "";
const TV = params.has("tv");
if (TV) document.body.classList.add("tv");

// QR de la mesa: ?t=CODIGO&mesa=3&k=código-del-torneo
const MESA = Number(params.get("mesa")) || null;
const KMESA = params.get("k") || "";
let ST = null, VERSION = 0, tab = MESA ? "mesa" : (params.get("v") || "inicio"), filtro = "", catVista = null;
const RM = { grupo: null, partido: null, goles: [], revisar: null, enviado: null, error: "" };   // estado del formulario de la mesa
let mesaAvisada = null;                                    // para no repetir el pitido
const kYo = "torneo-yo:" + CODIGO;
let YO = (() => { try { return JSON.parse(localStorage.getItem(kYo)) || null; } catch (_) { return null; } })();
function guardarYo(v) { YO = v; try { v ? localStorage.setItem(kYo, JSON.stringify(v)) : localStorage.removeItem(kYo); } catch (_) {} }

/* ---------------- arranque ---------------- */
(async function inicio() {
  TC.registrarSW();
  if (!CODIGO) return listaTorneos();
  await S.cargarConfig();
  try {
    await recargar();
  } catch (e) {
    $("#main").innerHTML = `<div class="vacio">${esc(e.message)}<br><br><a class="btn" href="index.html">Ver todos los torneos</a></div>`;
    return;
  }
  setInterval(comprobar, (C.refrescoSeg || 10) * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) comprobar(); });
  setInterval(() => { if (tab === "inicio" || TV) pintar(); }, 30000);  // refresca los "hace x min"
})();

function listaTorneos() {
  $("#tabs").innerHTML = "";
  $("#main").innerHTML = `<div class="vacio">Enlace no válido.<br>Pide a la organización el enlace del torneo.</div>`;
}

function privacidad() {
  TC.modal(`<h3>Privacidad</h3><div class="small stack">
    <p>Responsable: ${esc(C.entidad)}.</p>
    <p>Pedimos un teléfono por pareja sólo para avisaros durante el torneo de cuándo y en qué mesa jugáis. No se publica ni se cede a nadie y se borra en cuanto termina el torneo.</p>
    <p>Si activas los avisos, tu navegador guarda una suscripción que sólo sirve para enviarte esas notificaciones. Al terminar el torneo se borran los teléfonos y las suscripciones.</p>
    <p>Para borrar tus datos antes, escribe a la organización.</p></div>
    <button class="btn" data-cerrar style="width:100%;margin-top:12px">Cerrar</button>`);
}

async function recargar() {
  const r = await S.cargar(CODIGO);
  const antes = ST;
  ST = r.datos; VERSION = r.version;
  if (YO && !T.equipo(ST, YO.equipoId)) guardarYo(null);
  document.title = ST.nombre + " · Torneos AMF";
  $("#tTitulo").textContent = ST.nombre;
  $("#tSub").textContent = [ST.fecha, ST.lugar, TC.FASES[ST.fase]].filter(Boolean).join(" · ");
  $("#sync").textContent = "Actualizado " + new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  $("#sync").classList.remove("err");
  if (!catVista || !ST.config.categorias.some(c => c.id === catVista)) catVista = (ST.config.categorias[0] || {}).id;
  revisarMiLlamada(antes);
  pintar();
}

async function comprobar() {
  try {
    const v = await S.version(CODIGO);
    if (v !== VERSION) await recargar();
    else { $("#sync").classList.remove("err"); }
  } catch (_) {
    $("#sync").textContent = "Sin conexión"; $("#sync").classList.add("err");
  }
}

// Si mi pareja acaba de ser llamada a una mesa: pitido, vibración y notificación local
function revisarMiLlamada(antes) {
  if (!YO) return;
  const p = ST.partidos.find(x => x.estado === "mesa" && (x.a === YO.equipoId || x.b === YO.equipoId));
  if (!p) { mesaAvisada = null; return; }
  const clave = p.id + "@" + p.mesa + "@" + (p.avisos || 0);
  if (mesaAvisada === clave) return;
  const primeraCarga = !antes;
  mesaAvisada = clave;
  if (primeraCarga) return;
  TC.pitido();
  if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 600]);
  const rival = nombre(ST, p.a === YO.equipoId ? p.b : p.a);
  if (document.hidden && "Notification" in window && Notification.permission === "granted") {
    navigator.serviceWorker.getRegistration().then(reg => reg && reg.showNotification("¡Os toca! Mesa " + p.mesa, { body: "Contra " + rival, tag: "llamada", icon: "icon-192.png" }));
  }
  if (tab !== "mesa") tab = "yo";
}

/* ---------------- pintado ---------------- */
function pestañas() {
  const t = [];
  if (MESA) t.push(["mesa", "Mesa " + MESA]);
  t.push(["inicio", "En juego"]);
  if (ST.config.inscripcionAbierta) t.push(["inscribirse", "Inscribirse"]);
  t.push(["yo", YO ? "Mi pareja" : "¿Cuándo juego?"]);
  if (ST.grupos.length) t.push(["grupos", "Grupos"]);
  if (Object.values(ST.cuadros).some(c => c.generado)) t.push(["cuadros", "Cuadros"]);
  t.push(["parejas", "Parejas", T.equiposActivos(ST).length]);
  if (!t.some(x => x[0] === tab)) tab = t[0][0];
  $("#tabs").innerHTML = t.map(([id, txt, n]) => `<button class="tab ${tab === id ? "on" : ""}" data-tab="${id}">${txt}${n != null ? `<span class="n">${n}</span>` : ""}</button>`).join("");
}

function pintar() {
  if (!ST) return;
  pestañas();
  const vistas = { mesa: vMesa, inicio: vInicio, inscribirse: vInscribirse, yo: vYo, grupos: vGrupos, cuadros: vCuadros, parejas: vParejas };
  if (TV) { $("#main").innerHTML = vTV(); return; }
  const foco = document.activeElement && document.activeElement.id;
  const pos = foco && document.activeElement.selectionStart;
  $("#main").innerHTML = (vistas[tab] || vInicio)();
  if (foco && $("#" + foco)) { const el = $("#" + foco); el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if (b) { tab = b.dataset.tab; pintar(); window.scrollTo({ top: 0 }); return; }
  const c = e.target.closest("[data-cat]");
  if (c) { catVista = c.dataset.cat; pintar(); return; }
  const mg = e.target.closest("[data-mg]");
  if (mg) { RM.grupo = mg.dataset.mg; RM.partido = null; pintar(); return; }
  const mp = e.target.closest("[data-mp]");
  if (mp) { elegirPartidoMesa(mp.dataset.mp); return; }
  const ma = e.target.closest("[data-mesa-acc]");
  if (ma) { accionMesa(ma.dataset.mesaAcc); return; }
  const y = e.target.closest("[data-elegir]");
  if (y) { guardarYo({ equipoId: y.dataset.elegir }); mesaAvisada = null; revisarMiLlamada(null); tab = "yo"; pintar(); window.scrollTo({ top: 0 }); }
});
document.addEventListener("input", e => {
  if (e.target.id === "buscar") { filtro = e.target.value; pintar(); }
  if (e.target.dataset.gol) {                         // goles del formulario de la mesa (se guardan aunque la página se repinte)
    const [i, lado] = e.target.dataset.gol.split(":");
    RM.goles[+i][+lado] = e.target.value;
    const m = $("#mesaMarcador"); if (m) m.innerHTML = marcadorMesaHtml();
  }
});

function vResumen() {
  const r = T.resumen(ST);
  return `<div class="grid-s" style="margin-bottom:16px">
    <div class="card stat"><b>${r.equipos}</b><span class="dim small">parejas</span></div>
    <div class="card stat"><b>${r.grupos || "–"}</b><span class="dim small">grupos</span></div>
    <div class="card stat"><b>${r.jugados}/${r.partidos || "–"}</b><span class="dim small">partidos jugados</span></div>
    <div class="card stat"><b>${r.enMesa}</b><span class="dim small">en juego ahora</span></div></div>`;
}

function vInicio() {
  let h = "";
  if (YO) h += tarjetaMiPartido();
  else if (ST.fase !== "inscripcion") h += `<div class="card" style="margin-bottom:16px"><b>¿Quieres saber <span data-fx-rotar="cuándo|en qué mesa|contra quién">cuándo</span> juegas?</b> <span class="dim">Elige tu pareja y activa los avisos en el móvil.</span><div style="margin-top:10px"><button class="btn pri" data-tab="yo">Buscar mi pareja</button></div></div>`;
  if (ST.fase === "inscripcion") {
    h += `<div class="card" style="margin-bottom:16px"><h3>Inscripciones ${ST.config.inscripcionAbierta ? "abiertas" : "cerradas"}</h3>
      <p class="dim">${T.equiposActivos(ST).length} de ${ST.config.maxEquipos} parejas inscritas.</p>
      ${ST.config.inscripcionAbierta ? `<div style="margin-top:10px"><button class="btn pri" data-tab="inscribirse">Inscribir mi pareja</button></div>` : ""}</div>`;
  }
  h += vResumen();
  if (ST.fase === "inscripcion" || ST.fase === "grupos") h += vFormato();
  h += `<h2>En juego</h2>` + TC.htmlMesasPublicas(ST);
  const cola = T.cola(ST).slice(0, 12);
  if (cola.length) {
    h += `<h2 style="margin-top:20px">Próximos partidos</h2><div class="card">` + cola.map((p, i) =>
      `<div class="pg"><span class="a">${esc(nombre(ST, p.a))}</span><span class="res">${i + 1}º</span><span class="b">${esc(nombre(ST, p.b))}</span><span class="dim small">${esc(T.nombrePartido(ST, p))}</span></div>`).join("") + `</div>`;
  }
  const camps = ST.config.categorias.map(c => [c, T.campeon(ST, c.id)]).filter(x => x[1]);
  if (camps.length) h += `<h2 style="margin-top:20px">Campeones</h2><div class="grid">` + camps.map(([c, id]) =>
    `<div class="card campeon"><span class="dim">🏆 ${esc(c.nombre)}</span><b>${esc(nombre(ST, id))}</b><span class="small dim">${esc(jugadores(ST, id))}</span></div>`).join("") + `</div>`;
  return h;
}

function vFormato() {
  const f = ST.config.formatos;
  const ds = T.divisiones(ST);
  const bloque = d => {
    const cats = ST.config.categorias.filter(c => (c.division || ds[0].id) === d.id).map(c => `<li><b>${esc(c.nombre)}</b>: ${c.posiciones.length ? c.posiciones.map(p => p + "º").join(", ") + " de cada grupo · " : ""}${c.formato === "doble"
      ? `doble K (si pierdes en ganadores bajas a perdedores; con 4 y 4 se sortean los cruces y el de ganadores empieza ${ST.config.ventajaCruce}-0)` : "eliminatoria directa"} · ${esc(T.textoFormato(T.formatoDe(ST, { tipo: "K", cat: c.id })))}</li>`).join("");
    const niv = d.modo === "niveles" ? `<li>Cada pareja tiene un <b>nivel</b>. Del 1º al 4º de grupo pasan a ${esc((ST.config.categorias.find(c => (c.division || ds[0].id) === d.id) || {}).nombre || "")}. El 5º y quien pierde en ganadores: si es de ese nivel (o mejor) va a perdedores; si es de un nivel inferior, baja a la categoría siguiente. Quien pierde en perdedores queda fuera.</li>` : "";
    return (ds.length > 1 ? `<li><b>${esc(d.nombre)}</b><ul style="padding-left:18px">${niv}${cats}</ul></li>` : niv + cats);
  };
  return `<div class="card small" style="margin-bottom:16px"><h3>Formato</h3><ul style="padding-left:18px" class="stack">
    <li><b>Grupos</b> de ${ST.config.tamGrupo}, todos contra todos · ${esc(T.textoFormato(f.grupos))}</li>${ds.map(bloque).join("")}</ul></div>`;
}

/* ---------- QR de la mesa: las parejas meten su resultado ---------- */
function partidoMesa() { return RM.partido && T.partido(ST, RM.partido); }

function elegirPartidoMesa(id) {
  const p = T.partido(ST, id);
  if (!p) return;
  const f = T.formatoDe(ST, p), v = p.ventaja ? ST.config.ventajaCruce || 0 : 0;
  const n = f.tipo === "fijo" ? f.partidas : 2 * f.partidas - 1 - v;
  RM.partido = id; RM.goles = Array.from({ length: n }, () => ["", ""]); RM.revisar = null; RM.error = ""; RM.enviado = null;
  pintar(); window.scrollTo({ top: 0 });
}

function golesMesa() { return RM.goles.filter(([a, b]) => a !== "" && b !== "").map(([a, b]) => [+a, +b]); }
function calcularMesa() {
  const p = partidoMesa(), gs = golesMesa();
  const v = p.ventaja ? ST.config.ventajaCruce || 0 : 0;
  return { gs, ra: gs.filter(([a, b]) => a > b).length + (p.ventaja === "a" ? v : 0), rb: gs.filter(([a, b]) => b > a).length + (p.ventaja === "b" ? v : 0) };
}
function marcadorMesaHtml() {
  const p = partidoMesa(); if (!p) return "";
  const { ra, rb } = calcularMesa();
  return `<b>${esc(nombre(ST, p.a))}</b> <span class="pill gold" style="font-size:1rem">${ra} - ${rb}</span> <b>${esc(nombre(ST, p.b))}</b>`;
}

function accionMesa(acc) {
  const p = partidoMesa();
  if (acc === "volver") { RM.partido = null; RM.revisar = null; RM.error = ""; pintar(); return; }
  if (acc === "otro") { RM.partido = null; RM.revisar = null; RM.enviado = null; RM.grupo = null; pintar(); return; }
  if (acc === "corregir") { RM.revisar = null; pintar(); return; }
  if (acc === "revisar") {
    const { gs, ra, rb } = calcularMesa();
    if (!gs.length) { RM.error = "Escribe los goles de cada partida."; pintar(); return; }
    try {
      // se comprueba con las mismas reglas que usa la organización
      T.registrarResultado(JSON.parse(JSON.stringify(ST)), p.id, null, null, { goles: gs });
    } catch (e) { RM.error = e.message; pintar(); return; }
    RM.error = ""; RM.revisar = { gs, ra, rb }; pintar(); return;
  }
  if (acc === "enviar" && RM.revisar) enviarMesa();
}

async function enviarMesa() {
  const p = partidoMesa(), r = RM.revisar;
  const b = $("[data-mesa-acc='enviar']"); if (b) { b.disabled = true; b.textContent = "Enviando…"; }
  try {
    const res = await S.proponer(CODIGO, KMESA, { partidoId: p.id, goles: r.gs, ra: r.ra, rb: r.rb, mesa: MESA });
    RM.enviado = { texto: `${nombre(ST, p.a)} ${r.ra}-${r.rb} ${nombre(ST, p.b)}`, modo: res.modo };
    RM.partido = null; RM.revisar = null;
  } catch (e) { RM.error = e.message; }
  pintar(); window.scrollTo({ top: 0 });
}

function vMesa() {
  const modo = ST.config.resultadosParejas || "no";
  const enMesa = ST.partidos.filter(p => p.estado === "mesa" && p.mesa === MESA);
  let h = `<h2>Mesa ${MESA}</h2>`;
  const tarjetaEnMesa = enMesa.map(p => `<div class="card" style="margin-bottom:12px;border-color:var(--ok)">
      <span class="dim small">Jugando ahora en esta mesa · ${esc(T.nombrePartido(ST, p))} · ${esc(T.textoFormato(T.formatoDe(ST, p)))}</span>
      <h3 style="margin:6px 0 10px">${esc(nombre(ST, p.a))} <span class="dim">contra</span> ${esc(nombre(ST, p.b))}</h3>
      ${modo === "no" ? "" : `<button class="btn pri big" style="width:100%" data-mp="${esc(p.id)}">Apuntar el resultado</button>`}</div>`).join("");
  if (modo === "no") return h + tarjetaEnMesa + `<div class="card">En este torneo los resultados los apunta la organización. Cuando terminéis, avisad en la mesa de control.</div>`;
  if (RM.enviado) {
    return h + `<div class="card" style="border-color:var(--ok)"><h3>✅ Resultado enviado</h3><p style="margin:6px 0 12px">${esc(RM.enviado.texto)}</p>
      <p class="small dim">${RM.enviado.modo === "directo" ? "Se apunta solo en unos segundos. Si hay un error, avisad en la mesa de control." : "La organización lo revisará y lo apuntará en unos segundos."}</p>
      <button class="btn" style="margin-top:12px" data-mesa-acc="otro">Apuntar otro partido</button></div>`;
  }
  const p = partidoMesa();
  if (p) {
    if (p.estado === "fin") { RM.partido = null; return h + `<div class="card">Ese partido ya tiene resultado (${p.ra}-${p.rb}). Si está mal, avisad en la mesa de control.</div><button class="btn" style="margin-top:12px" data-mesa-acc="otro">Elegir otro partido</button>`; }
    const f = T.formatoDe(ST, p), v = p.ventaja ? ST.config.ventajaCruce || 0 : 0;
    if (RM.revisar) {
      return h + `<div class="card stack" style="border-color:var(--gold2)"><h3>¿Es correcto?</h3>
        <div style="font-size:1.15rem">${marcadorMesaHtml()}</div>
        <div class="small dim">Partidas: ${RM.revisar.gs.map(g => g.join("-")).join(" · ")}${v ? ` · ${esc(nombre(ST, p[p.ventaja]))} empezaba ${v}-0` : ""}</div>
        <div class="row"><button class="btn ok big" data-mesa-acc="enviar">Sí, enviar</button><button class="btn" data-mesa-acc="corregir">Corregir</button></div>
        ${RM.error ? `<div class="pill bad">${esc(RM.error)}</div>` : ""}</div>`;
    }
    return h + `<div class="card stack">
      <div class="small dim">${esc(T.nombrePartido(ST, p))} · ${esc(T.textoFormato(f))}${v ? ` · ${esc(nombre(ST, p[p.ventaja]))} empieza ${v}-0` : ""}</div>
      <div class="partidas"><span></span><b class="small" style="text-align:center">${esc(nombre(ST, p.a))}</b><b class="small" style="text-align:center">${esc(nombre(ST, p.b))}</b>
        ${RM.goles.map((g, i) => `<span class="small dim">Partida ${i + 1 + v}</span>
          <input type="number" inputmode="numeric" min="0" max="${f.goles + 5}" id="gol-${i}-0" data-gol="${i}:0" value="${esc(g[0])}" aria-label="Goles de ${esc(nombre(ST, p.a))} en la partida ${i + 1}">
          <input type="number" inputmode="numeric" min="0" max="${f.goles + 5}" id="gol-${i}-1" data-gol="${i}:1" value="${esc(g[1])}" aria-label="Goles de ${esc(nombre(ST, p.b))} en la partida ${i + 1}">`).join("")}</div>
      <div id="mesaMarcador" style="text-align:center">${marcadorMesaHtml()}</div>
      <p class="small dim">Deja vacías las partidas que no se jugaron.</p>
      ${RM.error ? `<div class="pill bad">${esc(RM.error)}</div>` : ""}
      <div class="row"><button class="btn pri big" data-mesa-acc="revisar">Revisar y enviar</button><button class="btn" data-mesa-acc="volver">Otro partido</button></div></div>`;
  }
  h += tarjetaEnMesa;
  // elegir grupo o categoría y luego la partida
  const grupos = ST.grupos.filter(g => ST.partidos.some(x => x.tipo === "G" && x.grupo === g.id && x.estado !== "fin"));
  const cats = ST.config.categorias.filter(c => T.partidosCuadro(ST, c.id).some(x => x.estado !== "fin" && x.a && x.b && !x.bye));
  if (!grupos.length && !cats.length) return h + `<div class="vacio">No hay partidos pendientes.</div>`;
  h += `<h3 style="margin-top:8px">${enMesa.length ? "¿Otro partido? " : ""}Elige tu grupo o categoría</h3><div class="row" style="margin:8px 0 14px">` +
    grupos.map(g => `<button class="btn sm ${RM.grupo === "G:" + g.id ? "pri" : ""}" data-mg="G:${esc(g.id)}">Grupo ${esc(g.id)}</button>`).join("") +
    cats.map(c => `<button class="btn sm ${RM.grupo === "K:" + c.id ? "pri" : ""}" data-mg="K:${esc(c.id)}">${esc(c.nombre)}</button>`).join("") + `</div>`;
  if (RM.grupo) {
    const [tipo, id] = [RM.grupo.slice(0, 1), RM.grupo.slice(2)];
    const ps = ST.partidos.filter(x => x.estado !== "fin" && x.a && x.b && !x.bye && (tipo === "G" ? x.tipo === "G" && x.grupo === id : x.tipo === "K" && x.cat === id));
    h += `<h3>¿Qué partida habéis jugado?</h3><div class="stack">` + ps.map(x => `<button class="card" style="text-align:left;cursor:pointer;width:100%" data-mp="${esc(x.id)}">
      <b>${esc(nombre(ST, x.a))}</b> <span class="dim">contra</span> <b>${esc(nombre(ST, x.b))}</b><div class="small dim">${esc(T.nombrePartido(ST, x))}${x.estado === "mesa" ? ` · mesa ${x.mesa}` : ""}</div></button>`).join("") + `</div>`;
  }
  return h;
}

/* ---------- inscripción ---------- */
function vInscribirse() {
  if (!ST.config.inscripcionAbierta) return `<div class="vacio">Las inscripciones están cerradas.</div>`;
  const n = T.equiposActivos(ST).length;
  if (n >= ST.config.maxEquipos) return `<div class="vacio">El torneo está completo (${n} parejas).</div>`;
  return `<h2>Inscribe a tu pareja</h2>
  <form class="card" id="fIns" style="max-width:520px" onsubmit="inscribir(event)">
    <div class="campo"><label class="f" for="iJ1">Jugador/a 1 *</label><input type="text" id="iJ1" required maxlength="40" autocomplete="name"></div>
    <div class="campo"><label class="f" for="iJ2">Jugador/a 2 *</label><input type="text" id="iJ2" required maxlength="40"></div>
    <div class="campo"><label class="f" for="iNom">Nombre de la pareja (opcional)</label><input type="text" id="iNom" maxlength="40" placeholder="Si lo dejas vacío: Jugador 1 / Jugador 2"></div>
    ${T.divisiones(ST).length > 1 ? `<div class="campo"><label class="f" for="iDiv">Torneo *</label><select id="iDiv">${T.divisiones(ST).map(d => `<option value="${esc(d.id)}">${esc(d.nombre)}</option>`).join("")}</select></div>` : ""}
    <div class="campo"><label class="f" for="iTel">Teléfono móvil de contacto *</label><input type="tel" id="iTel" required inputmode="tel" autocomplete="tel" placeholder="600 123 456"></div>
    <input type="text" id="iWeb" name="web" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <label class="check campo small"><input type="checkbox" id="iOk" required> <span>Acepto que la organización use este teléfono sólo para avisarnos durante el torneo (<a href="#" onclick="event.preventDefault();privacidad()">privacidad</a>). No se publica.</span></label>
    <button class="btn pri big" style="width:100%" id="bIns">Inscribirnos</button>
    <p class="small dim" style="margin-top:10px">${n} de ${ST.config.maxEquipos} plazas ocupadas.</p>
  </form>`;
}

async function inscribir(ev) {
  ev.preventDefault();
  const b = $("#bIns"); b.disabled = true; b.textContent = "Enviando…";
  try {
    const r = await S.inscribir(CODIGO, { j1: $("#iJ1").value, j2: $("#iJ2").value, nombre: $("#iNom").value, division: $("#iDiv") ? $("#iDiv").value : null }, $("#iTel").value, null, $("#iWeb").value);
    guardarYo({ equipoId: r.equipo.id, token: r.token });
    TC.toast("✅ ¡Pareja inscrita! Ahora activa los avisos en este móvil.", "ok", 6000);
    tab = "yo";
    await recargar();
  } catch (e) {
    TC.toast(esc(e.message), "bad", 6000);
    b.disabled = false; b.textContent = "Inscribirnos";
  }
}

/* ---------- mi pareja ---------- */
function tarjetaMiPartido() {
  const id = YO.equipoId;
  const enMesa = ST.partidos.find(p => p.estado === "mesa" && (p.a === id || p.b === id));
  if (enMesa) {
    const rival = enMesa.a === id ? enMesa.b : enMesa.a;
    return `<div class="toca" style="margin-bottom:16px"><span>¡OS TOCA JUGAR!</span><b>MESA ${enMesa.mesa}</b>
      <div>contra <strong>${esc(nombre(ST, rival))}</strong></div><div class="small" style="opacity:.85">${esc(T.nombrePartido(ST, enMesa))} · ${esc(T.textoFormato(T.formatoDe(ST, enMesa)))}</div>
      ${enMesa.ventaja ? `<div class="small" style="margin-top:4px">${enMesa[enMesa.ventaja] === id ? "Empezáis" : "Vuestro rival empieza"} ${ST.config.ventajaCruce}-0 por venir de ganadores</div>` : ""}</div>`;
  }
  const cola = T.cola(ST);
  const i = cola.findIndex(p => p.a === id || p.b === id);
  if (i >= 0) {
    const p = cola[i], rival = p.a === id ? p.b : p.a;
    return `<div class="card" style="margin-bottom:16px;border-color:var(--gold2)"><span class="dim small">Vuestro próximo partido</span>
      <h3 style="margin:4px 0">contra ${esc(nombre(ST, rival))}</h3><span class="dim">${esc(T.nombrePartido(ST, p))} · ${esc(T.textoFormato(T.formatoDe(ST, p)))} · ${i < 3 ? "¡Estad atentos, vais muy pronto!" : `hay ${i} partido(s) antes`}</span></div>`;
  }
  return "";
}

function vYo() {
  if (!YO) {
    const lista = T.equiposActivos(ST).filter(e => !filtro || (e.nombre + " " + e.j1 + " " + e.j2).toLowerCase().includes(filtro.toLowerCase()));
    return `<h2>¿Cuál es tu pareja?</h2>
      <input type="search" id="buscar" placeholder="Busca por tu nombre o el de la pareja" value="${esc(filtro)}" style="margin-bottom:12px">
      <div class="grid-s">${lista.slice(0, 60).map(e => `<button class="card" style="text-align:left;cursor:pointer" data-elegir="${esc(e.id)}"><b>${esc(e.nombre)}</b><div class="small dim">${esc(jugadores(ST, e.id))}</div></button>`).join("") || `<div class="vacio">Sin resultados</div>`}</div>`;
  }
  const id = YO.equipoId, eq = T.equipo(ST, id);
  let h = tarjetaMiPartido();
  h += `<div class="card" style="margin-bottom:16px"><div class="row"><div><h3 style="margin:0">${esc(eq.nombre)}</h3><div class="dim small">${esc(jugadores(ST, id))}</div></div><span class="spacer"></span>
    <button class="btn sm" onclick="guardarYo(null);pintar()">No somos nosotros</button></div>
    <div id="avisos" style="margin-top:12px">${htmlAvisos()}</div></div>`;
  const camino = TC.htmlCamino(ST, id);
  if (camino) h += `<div class="card" style="margin-bottom:16px"><h3>Vuestro camino</h3>${camino}</div>`;
  const g = ST.grupos.find(g => g.equipos.includes(id));
  if (g) h += TC.htmlGrupo(ST, g, { yo: id });
  const ko = ST.partidos.filter(p => p.tipo === "K" && !p.bye && (p.a === id || p.b === id));
  if (ko.length) {
    h += `<h2 style="margin-top:16px">Eliminatorias</h2><div class="card">` + ko.map(p => {
      const fin = p.estado === "fin";
      return `<div class="pg ${fin ? "fin" : ""}"><span class="a ${p.ganador === p.a ? "gana" : ""}">${esc(nombre(ST, p.a))}</span><span class="res">${fin ? p.ra + "-" + p.rb : p.estado === "mesa" ? "M" + p.mesa : "vs"}</span><span class="b ${p.ganador === p.b ? "gana" : ""}">${esc(nombre(ST, p.b))}</span><span class="small dim">${esc(T.nombrePartido(ST, p))}</span></div>`;
    }).join("") + `</div>`;
  }
  return h;
}

function htmlAvisos() {
  if (!S.pushDisponible) {
    if (TC.esIOS() && !TC.esPWA()) return `<div class="small"><b>📲 Para recibir avisos en iPhone:</b> pulsa <b>Compartir</b> ⎋ → <b>Añadir a pantalla de inicio</b>, abre la web desde el icono nuevo y vuelve aquí. Mientras tengas esta página abierta también te avisará con un pitido.</div>`;
    return `<div class="small dim">🔔 Mientras tengas esta página abierta te avisaremos con un pitido y vibración cuando os toque.</div>`;
  }
  if (TC.esIOS() && !TC.esPWA()) return `<div class="small"><b>📲 Para recibir avisos en iPhone:</b> pulsa <b>Compartir</b> ⎋ → <b>Añadir a pantalla de inicio</b>, abre la web desde el icono nuevo y activa los avisos allí.</div>`;
  if (YO.push) return `<div class="row"><span class="pill ok">🔔 Avisos activados en este móvil</span><button class="btn sm" onclick="activarAvisos()">Volver a activar</button></div>`;
  return `<button class="btn pri" onclick="activarAvisos()">🔔 Avisarme en este móvil cuando nos toque</button>
    <div class="small dim" style="margin-top:6px">Te llegará una notificación aunque tengas el móvil bloqueado.</div>`;
}

async function activarAvisos() {
  try {
    const sub = await TC.suscripcionPush(S.vapidPublica);
    let cred = YO.token ? { token: YO.token } : null;
    if (!cred) {
      const tel = prompt("Para confirmar que sois vosotros, escribe el teléfono con el que os inscribisteis:");
      if (!tel) return;
      cred = { telefono: tel };
    }
    await S.suscribir(CODIGO, YO.equipoId, cred, sub);
    guardarYo(Object.assign({}, YO, { push: true }));
    TC.toast("🔔 ¡Listo! Os avisaremos cuando os toque jugar.", "ok", 5000);
    pintar();
  } catch (e) {
    TC.toast(esc(e.message), "bad", 7000);
  }
}

/* ---------- grupos, cuadros, parejas ---------- */
function leyendaCategorias() {
  return `<div class="row small" style="margin-bottom:12px">` + ST.config.categorias.map(c =>
    `<span><span class="cat-dot" style="background:${TC.colorCat(ST, c.id)}"></span>${esc(c.nombre)}: ${c.posiciones.map(p => p + "º").join(", ")}</span>`).join("") + `</div>`;
}

function vGrupos() {
  const f = filtro.toLowerCase();
  const gs = ST.grupos.filter(g => !f || g.id.toLowerCase() === f || g.equipos.some(id => nombre(ST, id).toLowerCase().includes(f)));
  const ds = T.divisiones(ST);
  return `<h2>Grupos</h2><input type="search" id="buscar" placeholder="Buscar pareja o grupo" value="${esc(filtro)}" style="margin-bottom:12px">` +
    leyendaCategorias() + ds.map(d => {
      const suyos = gs.filter(g => (g.division || ds[0].id) === d.id);
      return suyos.length ? (ds.length > 1 ? `<h2>${esc(d.nombre)}</h2>` : "") + `<div class="grid" style="margin-bottom:18px">` + suyos.map(g => TC.htmlGrupo(ST, g, { yo: YO && YO.equipoId })).join("") + `</div>` : "";
    }).join("");
}

function vCuadros() {
  const cats = ST.config.categorias;
  return `<h2>Cuadros</h2><div class="row" style="margin-bottom:12px">` + cats.map(c =>
    `<button class="btn sm ${catVista === c.id ? "pri" : ""}" data-cat="${c.id}">${esc(c.nombre)}</button>`).join("") + `</div>` +
    (T.esNiveles(ST, catVista) ? `<h3 class="seccion">Así se mueven las parejas</h3>` + TC.htmlFlujoNiveles(ST, (T.categoria(ST, catVista).division || T.divisiones(ST)[0].id)) : "") +
    TC.htmlCuadro(ST, catVista, { yo: YO && YO.equipoId });
}

function vParejas() {
  const f = filtro.toLowerCase();
  const lista = T.equiposActivos(ST).filter(e => !f || (e.nombre + " " + e.j1 + " " + e.j2).toLowerCase().includes(f));
  const grupoDe = {};
  ST.grupos.forEach(g => g.equipos.forEach(id => (grupoDe[id] = g.id)));
  return `<h2>Parejas inscritas</h2><input type="search" id="buscar" placeholder="Buscar" value="${esc(filtro)}" style="margin-bottom:12px">
    <div class="card scroll-x"><table class="tabla"><thead><tr><th class="n">#</th><th>Pareja</th><th>Jugadores</th>${ST.grupos.length ? '<th class="n">Grupo</th>' : ""}</tr></thead><tbody>` +
    lista.map((e, i) => `<tr class="${YO && YO.equipoId === e.id ? "yo" : ""}"><td class="n dim">${i + 1}</td><td><b>${esc(e.nombre)}</b></td><td class="dim">${esc(jugadores(ST, e.id))}</td>${ST.grupos.length ? `<td class="n">${esc(grupoDe[e.id] || "")}</td>` : ""}</tr>`).join("") +
    `</tbody></table></div>`;
}

/* ---------- modo TV: pantalla grande en el local ---------- */
function vTV() {
  const cola = T.cola(ST).slice(0, 10);
  return `<div class="grid" style="grid-template-columns: 2fr 1fr"><div><h2>En juego</h2>${TC.htmlMesasPublicas(ST)}</div>
    <div><h2>Próximos</h2><div class="card">${cola.map((p, i) => `<div class="pg"><span class="a">${esc(nombre(ST, p.a))}</span><span class="res">${i + 1}</span><span class="b">${esc(nombre(ST, p.b))}</span><span></span></div>`).join("") || '<div class="dim">—</div>'}</div></div></div>`;
}
</script>
</body>
</html>
