<!DOCTYPE html>
<html lang="es" data-fx="ligero">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ciegos · panel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="../fx.css">
<script src="../fx.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <div class="titulo" id="tTitulo">Ciegos</div>
        <div class="sub" id="tSub">Torneos a sorteo</div>
      </div>
      <span class="spacer"></span>
      <span class="sync" id="sync"></span>
      <button class="btn sm oculto" id="bDeshacer" onclick="deshacer()" title="Deshacer el último cambio">↶ Deshacer</button>
      <a class="btn sm oculto" id="bPublica" target="_blank">Web pública ↗</a>
      <button class="btn sm" onclick="TC.cambiarTema()" aria-label="Cambiar tema">◐</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="vacio">Cargando…</div></main>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="comun.js"></script>
<script src="imagen.js"></script>
<script src="ciegos.js"></script>
<script src="ciegos-vista.js"></script>
<script>
"use strict";
const C = window.TORNEO_CONFIG, E = window.CiegosEngine, S = window.TorneoStore;
const { esc, $, $$ } = TC;
const PREFIJO = "ciegos-";

let rondaSel = null;
let ROL = null;                                      // "admin" (todo) o "ciegos" (sólo esta app)
let ST = null, VERSION = 0, CODIGO = "", PASS = "", tab = "juego", guardando = null, pendiente = false, auto = true;
const HIST = [];
let autoVidas = false;                             // Vidas: por defecto los partidos listos se llaman a mano
try { auto = localStorage.getItem("ciegos-auto") !== "0"; autoVidas = localStorage.getItem("ciegos-auto-vidas") === "1"; } catch (_) {}
const autoActivo = () => (ST && ST.modo === "vidas" ? autoVidas : auto);

/* ================= ACCESO ================= */
(async function inicio() {
  // misma sesión que el panel de torneos: si ya entraste allí, no vuelve a pedir la contraseña
  const leer = k => { try { return JSON.parse(sessionStorage.getItem(k)) || null; } catch (_) { return null; } };
  const ses = leer("ciegos-admin"), ses2 = leer("torneo-admin");
  PASS = (ses && ses.pass) || (ses2 && ses2.pass) || "";
  if (ses && ses.codigo && ses.modo === S.modo) { try { await abrir(ses.codigo); return; } catch (_) {} }
  pantallaAcceso();
})();

function slug(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
}

async function comprobarPass() {
  if (S.modo === "local") return true;
  const el = $("#aPass");
  if (el) PASS = el.value;
  if (!PASS) { TC.toast("Escribe la contraseña de organizador", "bad"); return false; }
  try { const r = await S.login(PASS); ROL = r.rol || "admin"; guardarSesion(); return true; }
  catch (e) { TC.toast(esc(e.message), "bad", 5000); return false; }
}
function guardarSesion() { try { sessionStorage.setItem("ciegos-admin", JSON.stringify({ codigo: CODIGO, pass: PASS, modo: S.modo })); } catch (_) {} }

async function pantallaAcceso() {
  $("#tabs").innerHTML = "";
  $("#tTitulo").textContent = "Ciegos";
  $("#tSub").textContent = "Torneos pequeños a sorteo · " + (S.modo === "local" ? "modo local" : "Supabase");
  let lista = [], err = "";
  if (S.modo === "local" || PASS) { try { lista = (await S.listar(PASS)).filter(t => t.codigo.startsWith(PREFIJO)); } catch (e) { err = e.message; } }
  const fases = { inscripcion: "Inscripción", juego: "Jugando", final: "Fase final", terminado: "Terminado" };
  const hoy = new Date().toISOString().slice(0, 10);
  $("#main").innerHTML = `
  <div class="grid" style="align-items:start">
    <div class="card stack">
      <h2>Entrar</h2>
      ${err ? `<div class="small" style="color:var(--bad)">${esc(err)}</div>` : ""}
      <div class="row">
        <button class="btn sm ${S.modo === "remoto" ? "pri" : ""}" onclick="S.setModo('remoto');pantallaAcceso()">☁️ Supabase</button>
        <button class="btn sm ${S.modo === "local" ? "pri" : ""}" onclick="S.setModo('local');pantallaAcceso()">💻 Local</button>
      </div>
      ${S.modo === "remoto" ? `<div><label class="f" for="aPass">Contraseña de organizador</label><div class="row"><input type="password" id="aPass" autocomplete="current-password" value="${esc(PASS)}" style="flex:1" onkeydown="if(event.key==='Enter')verLista()"><button class="btn pri" type="button" onclick="verLista()">Entrar</button></div><div class="small dim" style="margin-top:4px">La de organizador o la de Ciegos.</div></div>` : `<p class="small dim">En modo local todo se guarda en este navegador.</p>`}
      <div><label class="f">Torneos Ciegos</label>
        ${lista.length ? lista.map(t => `<button class="btn" style="width:100%;justify-content:space-between;margin-bottom:6px" onclick="entrar('${esc(t.codigo)}')"><span>${esc(t.nombre || t.codigo)}</span><span class="dim small">${esc(t.fecha || "")} · ${esc(fases[t.fase] || "")}</span></button>`).join("") : `<div class="dim small">${S.modo === "remoto" && !PASS ? "Entra para ver los torneos." : "Todavía no hay ninguno."}</div>`}
      </div>
      ${S.modo === "local" || ROL === "admin" ? `<a class="btn sm" href="g0tla7y18tpb.html">← Panel de torneos grandes</a>` : ""}
    </div>
    <form class="card stack" onsubmit="crear(event)">
      <h2>Nuevo torneo</h2>
      <div><label class="f" for="nNombre">Nombre</label><input type="text" id="nNombre" required placeholder="Ciegos de los viernes"></div>
      <div class="row"><div style="flex:1"><label class="f" for="nFecha">Fecha</label><input type="date" id="nFecha" value="${hoy}"></div><div style="flex:1"><label class="f" for="nLugar">Lugar</label><input type="text" id="nLugar" placeholder="Melide"></div></div>
      <div><label class="f">Formato</label>
        <div class="stack" style="gap:6px">${Object.entries(E.MODOS).map(([k, m], i) => `<label class="opcion"><input type="radio" name="nModo" value="${k}" ${i ? "" : "checked"}><span><b>${esc(m.nombre)}</b><br><span class="small dim">${esc(m.texto)}</span></span></label>`).join("")}</div></div>
      <button class="btn pri">Crear</button>
    </form>
  </div>`;
}
async function verLista() { if (await comprobarPass()) pantallaAcceso(); }
async function entrar(codigo) {
  if (!(await comprobarPass())) return;
  try { await abrir(codigo); } catch (e) { TC.toast(esc(e.message), "bad"); }
}

async function crear(ev) {
  ev.preventDefault();
  if (!(await comprobarPass())) return;
  const nombre = $("#nNombre").value.trim(), fecha = $("#nFecha").value;
  const modo = ($("input[name=nModo]:checked") || {}).value || "ciegos";
  const codigo = PREFIJO + (slug(nombre) || "torneo") + "-" + Math.random().toString(36).slice(2, 6);
  const st = E.nuevoTorneo({ codigo, nombre, fecha, lugar: $("#nLugar").value.trim(), modo });
  try {
    await S.crear(codigo, st, PASS);
    await abrir(codigo);
    tab = "jugadores"; pintar();
    TC.toast("Creado. Apunta a los jugadores.", "ok");
  } catch (e) { TC.toast(esc(e.message), "bad"); }
}

async function abrir(codigo) {
  const r = await S.cargar(codigo);
  if (!r.datos || r.datos.app !== "ciegos") throw new Error("Ese no es un torneo Ciegos");
  CODIGO = codigo; ST = r.datos; VERSION = r.version;
  if (S.modo === "remoto") ROL = (await S.login(PASS)).rol || "admin"; else ROL = "admin";
  guardarSesion();
  $("#bPublica").href = urlPublica(); $("#bPublica").classList.remove("oculto");
  tab = ST.fase === "inscripcion" ? "jugadores" : "juego";
  pintar();
  setInterval(sondear, (C.refrescoSeg || 10) * 1000);
  setInterval(() => { if (tab === "juego" && !$(".modal-bg")) pintar(); }, 30000);
}
function urlPublica(extra) {
  return location.href.replace(/[^/]*$/, "ciegos.html") + "?t=" + encodeURIComponent(CODIGO) + (S.modo === "local" ? "&local" : "") + (extra || "");
}
function salir() { try { sessionStorage.setItem("ciegos-admin", JSON.stringify({ pass: PASS, modo: S.modo })); } catch (_) {} location.reload(); }

/* ================= GUARDADO ================= */
function cambio(fn, txt) {
  const copia = JSON.stringify(ST);
  try { fn(); } catch (e) { TC.toast(esc(e.message), "bad", 5000); return false; }
  HIST.push(copia); if (HIST.length > 40) HIST.shift();
  if (txt) { ST.log = (ST.log || []).slice(-199); ST.log.push({ ts: Date.now(), txt }); }
  pintar(); guardar();
  return true;
}
function deshacer() {
  if (!HIST.length) return;
  ST = JSON.parse(HIST.pop());
  pintar(); guardar(); TC.toast("Cambio deshecho");
}
async function guardar() {
  if (guardando) { pendiente = true; return guardando; }
  estadoSync("Guardando…");
  guardando = (async () => {
    for (let i = 0; i < 2; i++) {
      try { VERSION = (await S.guardar(CODIGO, ST, VERSION, PASS)).version; estadoSync("Guardado ✓"); return; }
      catch (e) {
        if (!e.conflicto) { estadoSync("Error al guardar", true); TC.toast("No se pudo guardar: " + esc(e.message), "bad", 6000); return; }
        VERSION = (await S.cargar(CODIGO)).version;      // sólo escribe el organizador: se queda lo de este dispositivo
      }
    }
  })();
  try { await guardando; } finally { guardando = null; if (pendiente) { pendiente = false; guardar(); } }
}
function estadoSync(txt, err) { const s = $("#sync"); s.textContent = txt; s.classList.toggle("err", !!err); $("#bDeshacer").classList.toggle("oculto", !HIST.length); }
async function sondear() {
  if (guardando || document.hidden || $(".modal-bg")) return;
  try {
    const v = await S.version(CODIGO);
    if (v !== VERSION) { const r = await S.cargar(CODIGO); ST = r.datos; VERSION = r.version; if (tab !== "ajustes") pintar(); }
  } catch (_) { estadoSync("Sin conexión", true); }
}

/* ================= PINTADO ================= */
const VISTAS = { jugadores: vJugadores, juego: vJuego, rondas: vRondas, cuadro: vCuadro, tabla: vTabla, ajustes: vAjustes };
function pintar() {
  if (!ST) return;
  $("#tTitulo").textContent = ST.nombre;
  $("#tSub").textContent = [ST.fecha, ST.lugar, CV.estadoTexto(ST), S.modo === "local" ? "modo local" : ""].filter(Boolean).join(" · ");
  const n = E.activos(ST).length;
  const tabs = [["jugadores", ST.fase === "inscripcion" || !ST.parejas.length ? "Jugadores" : "Parejas", n], ["juego", "Panel"]];
  if (ST.modo !== "ciegos") tabs.push(["rondas", "Rondas", E.rondasVista(ST).length || null]);
  if (ST.modo === "ciegos" || ST.modo === "vidas") tabs.push(["cuadro", "🏆 Cuadro"]);
  if (ST.modo !== "ciegos") tabs.push(["tabla", "Clasificación"]);
  tabs.push(["ajustes", "Ajustes"]);
  if (!tabs.some(x => x[0] === tab)) tab = "juego";
  $("#tabs").innerHTML = tabs.map(([id, t, k]) => `<button class="tab ${tab === id ? "on" : ""}" data-tab="${id}">${t}${k != null ? `<span class="n">${k}</span>` : ""}</button>`).join("");
  const foco = document.activeElement && document.activeElement.id, y = window.scrollY;
  $("#main").innerHTML = VISTAS[tab]();
  CV.lineas($("#main"));
  if (foco && $("#" + foco)) $("#" + foco).focus();
  window.scrollTo(0, y);
  estadoSync($("#sync").textContent);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.dataset.tab; pintar(); window.scrollTo(0, 0); return; }
  const ll = e.target.closest("[data-llamar]");
  if (ll) { llamarA(ll.dataset.llamar); return; }
  const r = e.target.closest("[data-ronda]");
  if (r) { rondaSel = Number(r.dataset.ronda); pintar(); return; }
  const p = e.target.closest("[data-partido]");
  if (p && (p.classList.contains("click"))) modalResultado(p.dataset.partido);
});

/* ---------- jugadores ---------- */
function vJugadores() {
  const fijas = E.parejasFijas(ST), insc = ST.fase === "inscripcion";
  if (!insc) {
    return `<div class="card small" style="margin-bottom:14px">${CV.reglas(ST)}</div>` +
      (ST.parejas.length ? `<h2>Parejas</h2>${CV.htmlParejas(ST)}` : `<h2>Jugadores</h2><div class="grid-s">${E.activos(ST).map(j => `<div class="card"><b>${esc(j.nombre)}</b></div>`).join("")}</div>`);
  }
  const js = E.activos(ST);
  const necesita = E.individual(ST) ? "4 jugadores o más" : "2 parejas o más";
  const par = !fijas && !E.individual(ST) && js.length % 2;
  let h = `<div class="card small" style="margin-bottom:14px"><b>${esc(E.MODOS[ST.modo].nombre)}:</b> ${CV.reglas(ST)}</div>
  <div class="grid" style="align-items:start">
    <div class="card stack">
      <h2>${fijas ? "Apuntar pareja" : "Apuntar jugador"}</h2>
      ${fijas ? `<form class="row" onsubmit="event.preventDefault();añadirPareja()"><input type="text" id="nJ1" placeholder="Jugador 1" style="flex:1" autocomplete="off"><input type="text" id="nJ2" placeholder="Jugador 2" style="flex:1" autocomplete="off"><button class="btn pri">Añadir</button></form>`
        : `<form class="row" onsubmit="event.preventDefault();añadir()"><input type="text" id="nJug" placeholder="Nombre" style="flex:1" autocomplete="off" autofocus><button class="btn pri">Añadir</button></form>`}
      <details><summary class="small">Pegar una lista</summary>
        <textarea id="lista" rows="6" placeholder="${fijas ? "Una pareja por línea: Ana / Luis" : "Un nombre por línea"}" style="width:100%;margin-top:6px"></textarea>
        <button class="btn sm" type="button" onclick="pegarLista()" style="margin-top:6px">Añadir la lista</button></details>
    </div>
    <div class="card stack">
      <h2>Empezar</h2>
      <div class="big-n"><b>${fijas ? ST.parejas.length : js.length}</b> ${fijas ? "parejas" : "jugadores"}${!fijas && !E.individual(ST) ? ` · ${Math.floor(js.length / 2)} parejas` : ""}</div>
      ${par ? `<div class="pill warn">Número impar: falta o sobra un jugador para hacer parejas</div>` : ""}
      <div class="small dim">Hacen falta ${necesita}.</div>
      <button class="btn pri big" onclick="empezar()" ${par ? "disabled" : ""}>${E.individual(ST) ? "▶ Empezar la ronda 1" : fijas ? "▶ Empezar" : "🎲 Sortear parejas y empezar"}</button>
    </div>
  </div>
  <h2 style="margin-top:18px">${fijas ? "Parejas apuntadas" : "Apuntados"}</h2>`;
  if (fijas) h += ST.parejas.length ? `<div class="grid-s">${ST.parejas.map(p => `<div class="card row"><span><b>${esc(E.nombreJugador(ST, p.j1))}</b> y <b>${esc(E.nombreJugador(ST, p.j2))}</b></span><span class="spacer"></span><button class="btn sm" onclick="quitarPareja('${p.id}')" aria-label="Quitar">✕</button></div>`).join("")}</div>` : `<div class="vacio">Aún no hay nadie.</div>`;
  else h += js.length ? `<div class="grid-s">${js.map((j, i) => `<div class="card row"><span class="dim small">${i + 1}</span><b>${esc(j.nombre)}</b><span class="spacer"></span><button class="btn sm" onclick="quitar('${j.id}')" aria-label="Quitar">✕</button></div>`).join("")}</div>` : `<div class="vacio">Aún no hay nadie.</div>`;
  return h;
}
function añadir() {
  const v = $("#nJug").value.trim();
  if (!v) return;
  if (E.activos(ST).some(j => j.nombre.toLowerCase() === v.toLowerCase()) && !confirm(`Ya hay un «${v}». ¿Añadirlo igualmente?`)) return;
  if (cambio(() => E.añadirJugador(ST, v))) { $("#nJug").value = ""; $("#nJug").focus(); }
}
function añadirPareja() {
  const a = $("#nJ1").value.trim(), b = $("#nJ2").value.trim();
  if (!a || !b) return TC.toast("Faltan los dos nombres", "bad");
  if (cambio(() => E.añadirPareja(ST, a, b))) { $("#nJ1").value = ""; $("#nJ2").value = ""; $("#nJ1").focus(); }
}
function pegarLista() {
  const lineas = $("#lista").value.split(/\n/).map(x => x.trim()).filter(Boolean);
  if (!lineas.length) return;
  cambio(() => {
    lineas.forEach(l => {
      if (E.parejasFijas(ST)) { const [a, b] = l.split(/\s*[\/,;|]\s*|\s+y\s+/i); if (a && b) E.añadirPareja(ST, a, b); }
      else E.añadirJugador(ST, l);
    });
  }, `${lineas.length} añadidos de una lista`);
}
function quitar(id) { cambio(() => { ST.jugadores = ST.jugadores.filter(j => j.id !== id); }); }
function quitarPareja(id) {
  cambio(() => { const p = E.pareja(ST, id); ST.parejas = ST.parejas.filter(x => x.id !== id); ST.jugadores = ST.jugadores.filter(j => j.id !== p.j1 && j.id !== p.j2); });
}
function empezar() {
  const sortea = !E.parejasFijas(ST) && !E.individual(ST);
  if (!confirm(sortea ? "Se sortean las parejas y empieza el torneo. ¿Seguir?" : "¿Empezar el torneo?")) return;
  if (!cambio(() => E.empezar(ST), "Torneo empezado")) return;
  if (autoActivo()) cambio(() => E.asignarMesas(ST));
  tab = "juego"; pintar();
  if (sortea || ST.fase === "final") sorteoParejas();
}
function sorteoParejas() {
  TC.sorteoEnDirecto({
    titulo: "Sorteo de parejas · " + ST.nombre,
    columnas: ST.parejas.map((p, i) => ({ titulo: "Pareja " + (i + 1) })),
    bolas: ST.parejas.flatMap((p, i) => [{ col: i, texto: E.nombreJugador(ST, p.j1) }, { col: i, texto: E.nombreJugador(ST, p.j2) }])
  });
}

/* ---------- juego ---------- */
function vJuego() {
  if (ST.fase === "inscripcion") return `<div class="vacio">Primero <button class="btn sm" data-tab="jugadores">apunta a los jugadores</button> y empieza el torneo.</div>`;
  let h = "";
  if (ST.fase === "terminado") h += `<div class="card" style="margin-bottom:14px;text-align:center"><h2>🏁 Torneo terminado</h2>${CV.htmlPodio(ST)}<button class="btn pri" onclick="CV.imagenRedes(ST)">📸 Imagen de resultados para redes</button></div>`;
  h += CV.htmlResumen(ST);
  if (ST.modo === "vidas" && ST.fase === "juego") return h + vJuegoVidas();
  const libres = E.mesasLibres(ST).length, pend = E.pendientes(ST).filter(p => p.estado === "pendiente");
  if (ST.fase !== "terminado") h += `<div class="row" style="margin-bottom:14px">
    <button class="btn pri" onclick="rellenar()" ${!libres || !pend.length ? "disabled" : ""}>▶ Llamar a mesa</button>
    <label class="check"><input type="checkbox" ${auto ? "checked" : ""} onchange="auto=this.checked;try{localStorage.setItem('ciegos-auto',auto?'1':'0')}catch(_){}"> Automático: al meter un resultado se llama al siguiente</label>
    <span class="spacer"></span><span class="dim small">${pend.length} esperando · ${libres} mesa(s) libre(s)</span></div>`;
  // ¿siguiente ronda?
  if (E.puedeSiguienteRonda(ST) && ST.fase === "juego") {
    const fin = ST.modo === "vidas" && E.vivos(ST).length <= 8;
    const tot = E.rondasTotales(ST);
    const ultima = tot && ST.ronda >= tot;
    h += `<div class="card" style="margin-bottom:14px;border-color:var(--gold2)"><b>Ronda ${ST.ronda} terminada.</b>
      <div class="row" style="margin-top:8px"><button class="btn pri big" onclick="siguiente()">${fin ? "🎲 Sortear parejas y semifinales" : ultima ? "🏁 Cerrar y ver la clasificación final" : `▶ Ronda ${ST.ronda + 1}`}</button></div>
      ${fin ? `<div class="small dim" style="margin-top:6px">Quedan ${E.vivos(ST).length} jugadores en pie: se sortean ${Math.floor(E.vivos(ST).length / 2)} parejas${E.vivos(ST).length % 2 ? " (impar: se queda fuera quien tenga menos vidas)" : ""}.</div>` : ""}</div>`;
  }
  // mesas
  const enMesa = ST.partidos.filter(p => p.estado === "mesa").sort((a, b) => a.mesa - b.mesa);
  if (enMesa.length) h += `<h2>En mesa</h2><div class="mesas">` + enMesa.map(p => `<div class="mesa ocupada"><div class="row"><span class="num">Mesa ${p.mesa}</span><span class="spacer"></span><span class="t">⏱ ${TC.hace(p.llamado)}</span></div>
      <div class="small dim">${esc(E.nombrePartido(ST, p))}</div>
      <div class="vs"><span>${esc(E.nombreLado(ST, p.a))}</span><i>contra</i><span>${esc(E.nombreLado(ST, p.b))}</span></div>
      <div class="row"><button class="btn sm ok" onclick="modalResultado('${p.id}')">Resultado</button><button class="btn sm" onclick="cambio(()=>E.soltar(ST,'${p.id}'))" title="Devolver a la espera">↩</button></div></div>`).join("") + `</div>`;
  // ronda actual / cuadro
  if (ST.ko) h += `<h2 style="margin-top:18px">${ST.ko.fase === "final" ? "Fase final" : "Cuadro"}</h2>` + CV.htmlCuadroFinal(ST, { admin: true });
  if (ST.modo === "vidas") h += `<h2 style="margin-top:18px">Vidas</h2>` + CV.htmlTableroVidas(ST);
  if (ST.modo !== "ciegos" && ST.modo !== "vidas" && ST.ronda) h += `<h2 style="margin-top:18px">Ronda ${ST.ronda}${E.rondasTotales(ST) ? " de " + E.rondasTotales(ST) : ""}</h2>` + CV.htmlRonda(ST, ST.ronda, { admin: ST.fase === "juego" });
  if (ST.modo === "vidas" && ST.fase === "juego") h += `<div class="small dim" style="margin-top:8px">Quedan <b>${E.vivos(ST).length}</b> jugadores en pie. Con 8 en pie, 4 parejas a sorteo: semifinales y final.</div>`;
  return h;
}
function htmlMesasPanel() {
  const enMesa = ST.partidos.filter(p => p.estado === "mesa").sort((a, b) => a.mesa - b.mesa);
  if (!enMesa.length) return "";
  return `<div class="mesas">` + enMesa.map(p => `<div class="mesa ocupada"><div class="row"><span class="num">Mesa ${p.mesa}</span><span class="spacer"></span><span class="t">⏱ ${TC.hace(p.llamado)}</span></div>
      <div class="small dim">${esc(E.nombrePartido(ST, p))}</div>
      <div class="vs"><span>${esc(E.nombreLado(ST, p.a))}</span><i>contra</i><span>${esc(E.nombreLado(ST, p.b))}</span></div>
      <div class="row"><button class="btn sm ok" onclick="modalResultado('${p.id}')">Resultado</button><button class="btn sm" onclick="cambio(()=>E.soltar(ST,'${p.id}'))" title="Devolver a la espera">↩</button></div></div>`).join("") + `</div>`;
}

// Vidas: sin rondas. Al acabar un partido, en cuanto hay 4 libres se sortea otro.
function vJuegoVidas() {
  const e = E.estadoVidas(ST);
  let h = "";
  if (e.listaFinal) h += `<div class="card" style="margin-bottom:14px;border-color:var(--gold2)"><b>¡Quedan 8 en pie!</b>
      <div class="small dim" style="margin:4px 0 8px">Se sortean 4 parejas entre ellos (da igual las vidas) → semifinales y final.</div>
      <button class="btn pri big" onclick="siguiente()">🎲 Sortear parejas de semifinales</button></div>`;
  else if (e.fin) h += `<div class="card" style="margin-bottom:14px"><b>¡Quedan 8 en pie!</b> <span class="dim">Cuando acabe lo que se está jugando en las mesas (ya no elimina a nadie) se sortean las semifinales.</span></div>`;
  else if (e.vivos.length <= 12) h += `<div class="small dim" style="margin:-6px 0 12px">Quedan ${e.vivos.length} en pie: sólo se ponen en verde los partidos que aseguran llegar a 8 justos (los demás se recolocan).</div>`;
  h += `<label class="check" style="margin-bottom:12px"><input type="checkbox" ${autoVidas ? "checked" : ""} onchange="autoVidas=this.checked;try{localStorage.setItem('ciegos-auto-vidas',autoVidas?'1':'0')}catch(_){};if(autoVidas)rellenar()"> Llamar solos a mesa los partidos listos (si no, los llamas tú con el botón verde)</label>`;
  const listos = CV.htmlListos(ST);
  if (listos) h += `<h2>✅ Listos para jugar</h2>` + listos;
  const mesas = htmlMesasPanel();
  if (mesas) h += `<h2 style="margin-top:16px">En mesa</h2>` + mesas;
  h += `<h2 style="margin-top:16px">Rondas</h2>` + CV.htmlRondas(ST, rondaSel, { admin: true });
  h += `<h2 style="margin-top:18px">Vidas</h2>` + CV.htmlTableroVidas(ST);
  return h;
}
function llamarA(id) {
  const mesa = E.mesasLibres(ST)[0];
  if (!mesa) return TC.toast("Todas las mesas están ocupadas", "bad");
  const p = E.partido(ST, id);
  if (cambio(() => E.llamarVidas(ST, id, mesa), `Mesa ${mesa}: ${E.nombreLado(ST, p.a)} vs ${E.nombreLado(ST, p.b)}`)) TC.toast(`▶ Mesa ${mesa}: ${esc(E.nombreLado(ST, p.a))} <b>vs</b> ${esc(E.nombreLado(ST, p.b))}`, "ok", 5000);
}

function avisarNuevos(nuevos) {
  (nuevos || []).filter(p => p.fase === "ronda").forEach(p => TC.toast(`🎲 ${esc(E.nombreLado(ST, p.a))} <b>vs</b> ${esc(E.nombreLado(ST, p.b))}${p.mesa ? ` · <b>Mesa ${p.mesa}</b>` : ""}`, "ok", 6000));
}
// Tras meter un resultado (modo automático): llamar al siguiente o, en Vidas, sortear con los que han quedado libres
function trasResultado(estaba) {
  if (ST.fase === "terminado") return;
  const antes = ST.fase;
  let nuevos = [];
  // En Vidas siempre: rehacer partidos si alguien cae, sortear la ronda siguiente y, con 8, la fase final
  if (ST.modo === "vidas" && ST.fase === "juego") cambio(() => { nuevos = E.sortearVidas(ST); });
  if (autoActivo() && (estaba || nuevos.length || ST.fase !== antes)) cambio(() => E.asignarMesas(ST));
  if (antes === "juego" && ST.fase === "final") sorteoParejas();
  else if (nuevos.length) TC.toast(`🎲 Sorteada la ronda ${Math.max(...nuevos.map(p => p.ronda))}`, "ok", 5000);
}
function rellenar() { cambio(() => E.asignarMesas(ST)); }
function siguiente() {
  const antes = ST.fase;
  if (!cambio(() => E.siguienteRonda(ST), "Siguiente ronda")) return;
  if (autoActivo()) cambio(() => E.asignarMesas(ST));
  if (antes === "juego" && ST.fase === "final") sorteoParejas();       // Vidas: parejas de la fase final
  if (ST.fase === "terminado") TC.toast("🏁 Torneo terminado", "ok", 5000);
}

function modalResultado(id) {
  const p = E.partido(ST, id);
  if (!p || !p.a || !p.b || p.bye) return;
  const editar = p.estado === "fin";
  if (editar && !E.puedeEditar(ST, id)) return TC.toast("Ese resultado ya no se puede cambiar: hay partidos posteriores jugados", "bad");
  const pos = E.marcadoresPosibles(ST);
  TC.modal(`<h3>${esc(E.nombrePartido(ST, p))}${p.mesa ? " · Mesa " + p.mesa : ""}</h3>
    <p class="formato" style="margin:-6px 0 12px">${esc(E.textoFormato(ST.config.partidas))}</p>
    <div class="stack" style="gap:8px">
      <div class="marcador"><b>${esc(E.nombreLado(ST, p.a))}</b></div>
      <div class="rapidos">${pos.map(([x, y]) => `<button type="button" class="btn ${editar && p.ra === x && p.rb === y ? "pri" : ""}" data-m="${x}-${y}">${x}-${y}</button>`).join("")}</div>
      <div class="marcador"><b>${esc(E.nombreLado(ST, p.b))}</b></div>
    </div>
    <div class="small dim" style="margin:8px 0">El primer número es de la pareja de arriba.</div>
    <div class="row">${editar ? `<button class="btn sm bad" id="borrar">Borrar resultado</button>` : ""}<span class="spacer"></span><button class="btn" data-cerrar>Cancelar</button></div>`, (el, cerrar) => {
    el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
      const [x, y] = b.dataset.m.split("-").map(Number);
      const estaba = p.estado === "mesa";
      if (cambio(() => E.registrarResultado(ST, id, x, y), `${E.nombreLado(ST, p.a)} ${x}-${y} ${E.nombreLado(ST, p.b)}`)) {
        cerrar(); TC.toast("Resultado guardado", "ok");
        trasResultado(estaba);
        if (ST.fase === "terminado") TC.toast("🏁 ¡Torneo terminado!", "ok", 6000);
      }
    });
    const br = el.querySelector("#borrar");
    if (br) br.onclick = () => { if (confirm("¿Borrar el resultado?") && cambio(() => E.borrarResultado(ST, id), "Resultado borrado")) cerrar(); };
  });
}

/* ---------- clasificación / cuadro ---------- */
function vRondas() {
  if (ST.fase === "inscripcion") return `<div class="vacio">El torneo aún no ha empezado.</div>`;
  return CV.htmlRondas(ST, rondaSel, { admin: true });
}
function vCuadro() {
  if (ST.fase === "inscripcion") return `<div class="vacio">El torneo aún no ha empezado.</div>`;
  let h = CV.htmlPodio(ST);
  if (ST.fase === "terminado") h += `<div class="row" style="margin-bottom:14px"><button class="btn pri" onclick="CV.imagenRedes(ST)">📸 Imagen para redes</button></div>`;
  return h + CV.htmlCuadroFinal(ST, { admin: true });
}
function vTabla() {
  if (ST.fase === "inscripcion") return `<div class="vacio">El torneo aún no ha empezado.</div>`;
  let h = CV.htmlPodio(ST);
  if (ST.fase === "terminado") h += `<div class="row" style="margin-bottom:14px"><button class="btn pri" onclick="CV.imagenRedes(ST)">📸 Imagen para redes</button></div>`;
  return h + CV.htmlTabla(ST);
}

/* ---------- ajustes ---------- */
function vAjustes() {
  const c = ST.config, insc = ST.fase === "inscripcion", f = c.partidas;
  return `<form class="grid ajustes" style="align-items:start" onsubmit="guardarAjustes(event)">
  <div class="card stack">
    <h2>Torneo</h2>
    <div><label class="f">Nombre</label><input type="text" id="cNom" value="${esc(ST.nombre)}" required></div>
    <div class="row"><div style="flex:1"><label class="f">Fecha</label><input type="date" id="cFecha" value="${esc(ST.fecha)}"></div><div style="flex:1"><label class="f">Lugar</label><input type="text" id="cLugar" value="${esc(ST.lugar)}"></div></div>
    <div><label class="f">Formato</label><select id="cModo" ${insc ? "" : "disabled"}>${Object.entries(E.MODOS).map(([k, m]) => `<option value="${k}" ${ST.modo === k ? "selected" : ""}>${esc(m.nombre)} — ${esc(m.texto)}</option>`).join("")}</select></div>
    <div><label class="f">Mesas</label><input type="number" id="cMesas" min="1" max="40" value="${c.mesas}"></div>
  </div>
  <div class="card stack">
    <h2>Partidas</h2>
    <div class="row"><select id="fTipo" style="flex:2"><option value="al" ${f.tipo === "al" ? "selected" : ""}>Gana quien llega a</option><option value="fijo" ${f.tipo === "fijo" ? "selected" : ""}>Se juegan siempre</option></select>
      <input type="number" id="fPart" min="1" max="9" value="${f.partidas}" style="flex:1" aria-label="Partidas"><span class="small dim">partidas de</span>
      <input type="number" id="fGol" min="1" max="20" value="${f.goles}" style="flex:1" aria-label="Goles"><span class="small dim">goles</span></div>
    ${ST.modo === "monster" || ST.modo === "suizo" ? `<div><label class="f">Rondas (0 = automático: ${ST.modo === "monster" ? "5" : "según parejas"})</label><input type="number" id="cRondas" min="0" max="30" value="${c.rondas}"></div>` : ""}
    ${ST.modo === "vidas" ? `<div><label class="f">Vidas de cada pareja</label><input type="number" id="cVidas" min="1" max="9" value="${c.vidas}" ${insc ? "" : "disabled"}></div>` : ""}
    ${ST.modo === "suizo" ? `<div><label class="f">Parejas</label><select id="cParejas" ${insc ? "" : "disabled"}><option value="sorteo" ${c.parejas !== "fijas" ? "selected" : ""}>A sorteo (cada uno se apunta solo)</option><option value="fijas" ${c.parejas === "fijas" ? "selected" : ""}>Fijas (se apuntan por parejas)</option></select></div>` : ""}
    ${ST.modo === "ciegos" ? `<label class="check"><input type="checkbox" id="cTercer" ${c.tercerPuesto ? "checked" : ""} ${insc ? "" : "disabled"}> Partido por el 3er puesto</label>` : ""}
  </div>
  <div class="card stack">
    <h2>Compartir</h2>
    <a class="btn" target="_blank" href="${esc(urlPublica())}">Web pública ↗</a>
    <a class="btn" target="_blank" href="${esc(urlPublica("&tv"))}">Pantalla TV ↗</a>
    <button type="button" class="btn" onclick="CV.imagenRedes(ST)" ${ST.fase === "terminado" ? "" : "disabled"}>📸 Imagen para redes</button>
  </div>
  <div class="card stack">
    <h2>Guardar</h2>
    <button class="btn pri big">Guardar ajustes</button>
    <div class="row"><button type="button" class="btn sm" onclick="salir()">Cambiar de torneo</button><button type="button" class="btn sm bad" onclick="borrar()">Borrar torneo</button></div>
    <details class="small"><summary>Historial (${(ST.log || []).length})</summary><div style="max-height:240px;overflow:auto;margin-top:6px">${(ST.log || []).slice().reverse().map(l => `<div><span class="dim">${new Date(l.ts).toLocaleTimeString("es-ES")}</span> ${esc(l.txt)}</div>`).join("")}</div></details>
  </div></form>`;
}
function guardarAjustes(ev) {
  ev.preventDefault();
  const insc = ST.fase === "inscripcion";
  cambio(() => {
    ST.nombre = $("#cNom").value.trim() || ST.nombre; ST.fecha = $("#cFecha").value; ST.lugar = $("#cLugar").value.trim();
    const c = ST.config;
    if (insc && $("#cModo").value !== ST.modo) {
      ST.modo = $("#cModo").value;
      c.partidas = Object.assign({}, E.MODOS[ST.modo].partidas);
    } else c.partidas = { tipo: $("#fTipo").value, partidas: Math.max(1, +$("#fPart").value || 1), goles: Math.max(1, +$("#fGol").value || 7) };
    c.mesas = Math.max(1, +$("#cMesas").value || 1);
    if ($("#cRondas")) c.rondas = Math.max(0, +$("#cRondas").value || 0);
    if ($("#cVidas") && insc) c.vidas = Math.max(1, +$("#cVidas").value || 3);
    if ($("#cParejas") && insc) {
      const nuevo = $("#cParejas").value;
      if (nuevo !== c.parejas && (ST.jugadores.length)) throw new Error("Para cambiar entre parejas fijas y a sorteo, quita antes a los apuntados");
      c.parejas = nuevo;
    }
    if ($("#cTercer") && insc) c.tercerPuesto = $("#cTercer").checked;
  }, "Ajustes guardados") && TC.toast("Ajustes guardados", "ok");
}
async function borrar() {
  if (prompt(`Para borrar el torneo escribe su nombre: ${ST.nombre}`) !== ST.nombre) return;
  try { await S.borrar(CODIGO, PASS); salir(); } catch (e) { TC.toast(esc(e.message), "bad"); }
}
</script>
</body>
</html>
