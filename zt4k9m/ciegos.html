<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ciegos · AMF</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="../fx.css">
<script src="../fx.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <div class="titulo" id="tTitulo">Ciegos</div>
        <div class="sub" id="tSub"></div>
      </div>
      <span class="spacer"></span>
      <span class="sync" id="sync"></span>
      <button class="btn sm no-tv" onclick="TC.cambiarTema()" aria-label="Cambiar tema">◐</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="vacio">Cargando…</div></main>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="comun.js"></script>
<script src="imagen.js"></script>
<script src="ciegos.js"></script>
<script src="ciegos-vista.js"></script>
<script>
"use strict";
const C = window.TORNEO_CONFIG, E = window.CiegosEngine, S = window.TorneoStore;
const { esc, $ } = TC;
const params = new URLSearchParams(location.search);
const CODIGO = params.get("t") || "";
const TV = params.has("tv");
if (TV) document.body.classList.add("tv");
let ST = null, VERSION = 0, tab = "juego", tvIdx = 0, tvPintada = -1;

(async function inicio() {
  if (!CODIGO.startsWith("ciegos-")) { $("#main").innerHTML = `<div class="vacio">Enlace no válido.<br>Pide a la organización el enlace del torneo.</div>`; return; }
  try { await recargar(); }
  catch (e) { $("#main").innerHTML = `<div class="vacio">${esc(e.message)}</div>`; return; }
  setInterval(comprobar, (C.refrescoSeg || 10) * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) comprobar(); });
  setInterval(pintar, 30000);
  if (TV) setInterval(() => { tvIdx++; pintar(); }, Math.max(5, Number(params.get("seg")) || 15) * 1000);
})();

async function recargar() {
  const r = await S.cargar(CODIGO);
  if (!r.datos || r.datos.app !== "ciegos") throw new Error("Torneo no encontrado");
  ST = r.datos; VERSION = r.version;
  document.title = ST.nombre + " · Ciegos";
  $("#tTitulo").textContent = ST.nombre;
  $("#tSub").textContent = [ST.fecha, ST.lugar, CV.estadoTexto(ST)].filter(Boolean).join(" · ");
  $("#sync").textContent = "Actualizado " + new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  $("#sync").classList.remove("err");
  pintar();
}
async function comprobar() {
  try { if ((await S.version(CODIGO)) !== VERSION) await recargar(); }
  catch (_) { $("#sync").textContent = "Sin conexión"; $("#sync").classList.add("err"); }
}

function pintar() {
  if (!ST) return;
  if (TV) { $("#tabs").innerHTML = ""; $("#main").innerHTML = vTV(); return; }
  const tabs = [["juego", "En juego"], ["tabla", ST.modo === "ciegos" ? "Cuadro" : "Clasificación"], ["gente", ST.parejas.length ? "Parejas" : "Jugadores", E.activos(ST).length]];
  $("#tabs").innerHTML = tabs.map(([id, t, n]) => `<button class="tab ${tab === id ? "on" : ""}" data-tab="${id}">${t}${n != null ? `<span class="n">${n}</span>` : ""}</button>`).join("");
  $("#main").innerHTML = ({ juego: vJuego, tabla: vTabla, gente: vGente })[tab]();
}
document.addEventListener("click", e => { const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; pintar(); window.scrollTo(0, 0); } });

function vJuego() {
  let h = "";
  if (ST.fase === "terminado") h += `<div class="card" style="text-align:center;margin-bottom:14px"><h2>🏁 Resultado final</h2>${CV.htmlPodio(ST)}<button class="btn" onclick="CV.imagenRedes(ST)">📸 Imagen para compartir</button></div>`;
  if (ST.fase === "inscripcion") h += `<div class="card" style="margin-bottom:14px"><h3>${esc(E.MODOS[ST.modo].nombre)}</h3><p class="small">${CV.reglas(ST)}</p><p class="dim" style="margin-top:8px">${E.activos(ST).length} apuntados. Aún no ha empezado.</p></div>`;
  if (ST.fase === "juego" || ST.fase === "final") {
    h += `<h2>En juego</h2>` + CV.htmlMesas(ST);
    const cola = CV.htmlCola(ST);
    if (cola) h += `<h2 style="margin-top:18px">Próximos</h2>` + cola;
    if (ST.modo === "vidas") h += `<h2 style="margin-top:18px">Vidas</h2>` + CV.htmlTableroVidas(ST);
  }
  if (ST.fase !== "inscripcion") h += `<details style="margin-top:16px"><summary class="small">Cómo se juega</summary><p class="small" style="margin-top:6px">${CV.reglas(ST)}</p></details>`;
  return h;
}
function vTabla() {
  if (ST.fase === "inscripcion") return `<div class="vacio">Aún no ha empezado.</div>`;
  let h = CV.htmlPodio(ST);
  if (ST.ko) h += `<h2>${ST.ko.fase === "final" ? "Fase final" : "Cuadro"}</h2>` + CV.htmlCuadro(ST);
  if (ST.modo !== "ciegos") {
    h += `<h2 style="margin-top:16px">Clasificación</h2>` + CV.htmlTabla(ST);
    if (ST.modo !== "vidas") for (let r = ST.ronda; r >= 1; r--) h += `<details ${r === ST.ronda ? "open" : ""} style="margin-top:12px"><summary><b>Ronda ${r}</b></summary>${CV.htmlRonda(ST, r)}</details>`;
  }
  return h;
}
function vGente() {
  if (ST.parejas.length && ST.fase !== "inscripcion") return `<h2>Parejas</h2>` + CV.htmlParejas(ST);
  return `<h2>Apuntados</h2><div class="grid-s">${E.activos(ST).map(j => `<div class="card"><b>${esc(j.nombre)}</b></div>`).join("") || '<div class="vacio">Aún no hay nadie.</div>'}</div>`;
}

/* ---------- TV: va cambiando sola ---------- */
function diapositivas() {
  const d = [];
  if (ST.fase === "terminado") d.push({ t: "Resultado final", h: () => CV.htmlPodio(ST) });
  if (ST.fase === "juego" || ST.fase === "final") d.push({ t: "En juego", h: () => `<div class="grid" style="grid-template-columns:2fr 1fr"><div>${CV.htmlMesas(ST)}</div><div><h2>Próximos</h2>${CV.htmlCola(ST, 10) || '<div class="dim">—</div>'}</div></div>` });
  if (ST.ko) d.push({ t: ST.ko.fase === "final" ? "Fase final" : "Cuadro", h: () => CV.htmlCuadro(ST) });
  if (ST.modo !== "ciegos" && ST.fase !== "inscripcion") d.push({ t: "Clasificación", h: () => CV.htmlTabla(ST) });
  if (ST.modo === "vidas" && ST.fase !== "inscripcion") d.unshift({ t: "Vidas", h: () => CV.htmlTableroVidas(ST) });
  if (ST.fase === "inscripcion") d.push({ t: "Apuntados", h: vGente });
  return d;
}
function vTV() {
  const d = diapositivas();
  tvIdx = tvIdx % d.length;
  const s = d[tvIdx];
  setTimeout(() => (tvPintada = tvIdx), 0);
  return `<div class="tv-cab"><h2>${esc(s.t)}</h2><span class="spacer"></span>${d.length > 1 ? `<span class="tv-puntos">${d.map((_, i) => `<i class="${i === tvIdx ? "on" : ""}"></i>`).join("")}</span>` : ""}</div>
    <div class="${tvPintada !== tvIdx ? "tv-diapo" : ""}">${s.h()}</div>`;
}
</script>
</body>
</html>
